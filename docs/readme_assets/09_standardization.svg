<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Reality Probe scientific explainer</title><rect x="0.000" y="0.000" width="1600.000" height="900.000" fill="#f5f3ed"/><text x="76.000" y="51.000" font-family="Arial" font-size="19" font-weight="700" text-anchor="start" fill="#24343b">REALITY PROBE</text><text x="1524.000" y="51.000" font-family="Arial" font-size="18" font-weight="400" text-anchor="end" fill="#63747a">07  /  09</text><polyline points="76.000,72.000 1524.000,72.000" stroke="#cdd4d1" stroke-width="1" fill="none" stroke-linejoin="round"/><text x="76.000" y="145.000" font-family="Georgia" font-size="48" font-weight="400" text-anchor="start" fill="#24343b">A visible difference is not yet credible evidence.</text><rect x="76.000" y="859.000" width="1448.000" height="2.000" fill="#cdd4d1"/><rect x="76.000" y="859.000" width="1098.483" height="2.000" fill="#24343b"/><text x="800.000" y="310.000" font-family="Georgia" font-size="46" font-weight="400" text-anchor="middle" fill="#24343b">progress</text><text x="800.000" y="398.000" font-family="Georgia" font-size="45" font-weight="400" text-anchor="middle" fill="#24343b">baseline error − repair error</text><polyline points="430.000,425.000 1170.000,425.000" stroke="#24343b" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="800.000" y="488.000" font-family="Georgia" font-size="45" font-weight="400" text-anchor="middle" fill="#24343b">combined uncertainty</text><text x="800.000" y="580.000" font-family="Arial" font-size="27" font-weight="400" text-anchor="middle" fill="#63747a">measurement  +  repeat  +  numerical refinement</text><text x="800.000" y="650.000" font-family="Arial" font-size="25" font-weight="400" text-anchor="middle" fill="#63747a">Variances add; the denominator is their square root.</text><text x="800.000" y="790.000" font-family="Arial" font-size="30" font-weight="400" text-anchor="middle" fill="#24343b">Standardize the improvement by the uncertainty that remains.</text><text x="800.000" y="827.000" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle" fill="#63747a">Exact force statistic: z = [e(B,Y) − e(R,Y)] / √(σ²meas + σ²repeat + σ²num,B + σ²num,R)</text></svg>