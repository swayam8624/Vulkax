name: WIP Vulkax stabilization

on:
  push:
    branches:
      - work/stabilize-vulkax-main

permissions:
  contents: write

jobs:
  macos-and-cmake:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/stabilize-vulkax-main
      - name: Apply stabilized source migrations
        run: python3 scripts/phase17_stabilize.py
      - name: Build native Studio
        working-directory: apps/VulkaxPhysicsStudioMac
        run: swift build -c release
      - name: Canonical compiler and product smokes
        working-directory: apps/VulkaxPhysicsStudioMac
        run: |
          .build/release/VulkaxPhysicsStudioMac --native-canonical-equation-bridge-smoke
          .build/release/VulkaxPhysicsStudioMac --native-dynamic-equation-project-gpu-smoke
          .build/release/VulkaxPhysicsStudioMac --native-cinematic-capture-smoke
          .build/release/VulkaxPhysicsStudioMac --native-scene-mesh-gpu-smoke ../../tests/fixtures/airflow_cube.obj
      - name: Configure CMake
        run: >-
          cmake -S . -B build-stabilize -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DVULKAX_BUILD_PHYSICS_STUDIO=OFF
      - name: Build canonical CPU and vulkax_gpu surfaces
        run: cmake --build build-stabilize --target VulkaxComputeBenchmark PhysicsIrTests
      - name: Run canonical Physics IR tests
        run: ctest --test-dir build-stabilize -R '^physics_ir$' --output-on-failure
      - name: Commit validated stabilized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git diff --cached --check
          git commit -m "Stabilize canonical compiler, Windows and vulkax_gpu migrations"
          git push origin HEAD:work/stabilize-vulkax-main
