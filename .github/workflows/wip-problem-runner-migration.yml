name: WIP Problem Runner Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wip-problem-runner-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python scripts/apply_problem_runner_migration.py
      - name: Remove one-shot migration machinery
        run: |
          rm .github/workflows/wip-problem-runner-migration.yml
          rm scripts/apply_problem_runner_migration.py
      - name: Commit atomic migration
        run: |
          git config user.name "Vulkax Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add typed executable problem runner and granular vertical"
          git push origin HEAD:main
