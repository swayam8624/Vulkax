name: WIP canonical equation runtime v2

on:
  push:
    branches:
      - fix/canonical-equation-runtime

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canonical-equation-runtime
      - name: Apply portable canonical compiler migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/vulkax/physics/physics_ir.cpp')
          text=path.read_text()
          if '#include <cerrno>' not in text:
              text=text.replace('#include <charconv>\n','#include <charconv>\n#include <cerrno>\n#include <cstdlib>\n',1)
          old='''std::optional<double> parseDouble(const std::string& value) {
  double result = 0.0;
  const auto [end, error] = std::from_chars(value.data(), value.data() + value.size(), result);
  return error == std::errc{} && end == value.data() + value.size() ? std::optional<double>{result}
                                                                    : std::nullopt;
}
'''
          new='''std::optional<double> parseDouble(const std::string& value) {
  if (value.empty()) return std::nullopt;
  errno = 0;
  char* end = nullptr;
  const char* begin = value.c_str();
  const double result = std::strtod(begin, &end);
  if (begin == end || errno == ERANGE || end != begin + value.size()) return std::nullopt;
  return result;
}
'''
          if old in text: text=text.replace(old,new,1)
          elif 'std::strtod(begin, &end)' not in text: raise SystemExit('parseDouble marker missing')
          path.write_text(text)
          PY
          python3 scripts/phase13_canonical_bridge.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/VulkaxPhysicsStudioMac/Package.swift')
          t=p.read_text()
          t=t.replace('    cxxLanguageStandard: .cxx20,\n    swiftLanguageModes: [.v5]\n)','    swiftLanguageModes: [.v5],\n    cxxLanguageStandard: .cxx20\n)')
          p.write_text(t)
          PY
      - name: Build native Studio
        working-directory: apps/VulkaxPhysicsStudioMac
        run: swift build -c release
      - name: Verify canonical compiler and dynamic equation path
        working-directory: apps/VulkaxPhysicsStudioMac
        run: |
          .build/release/VulkaxPhysicsStudioMac --native-canonical-equation-bridge-smoke
          .build/release/VulkaxPhysicsStudioMac --native-dynamic-equation-project-gpu-smoke
          .build/release/VulkaxPhysicsStudioMac --native-gpu-smoke
      - name: Commit final source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vulkax/physics/physics_ir.cpp \
            src/vulkax/physics/compute_ir.cpp \
            src/vulkax/physics/compute_ir.hpp \
            apps/VulkaxPhysicsStudioMac/Package.swift \
            apps/VulkaxPhysicsStudioMac/Sources/VulkaxEquationBridge \
            apps/VulkaxPhysicsStudioMac/Sources/VulkaxPhysicsStudioMac/ScalarEquationCompiler.swift \
            apps/VulkaxPhysicsStudioMac/Sources/VulkaxPhysicsStudioMac/CanonicalEquationBridgeSmoke.swift \
            apps/VulkaxPhysicsStudioMac/Sources/VulkaxPhysicsStudioMac/main.swift
          git diff --cached --check
          git commit -m "Use canonical C++ equation compiler in native Studio"
          git push origin HEAD:fix/canonical-equation-runtime
