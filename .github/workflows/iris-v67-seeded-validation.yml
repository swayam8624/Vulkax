name: IRIS V6.7 Seeded Validation Quick

on:
  push:
    branches:
      - research/iris-freefall-v67-scale-aware
    paths:
      - .github/workflows/iris-v67-seeded-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seeded-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --quiet             "numpy>=1.26,<3"             "opencv-python-headless>=4.10,<5"             "huggingface_hub>=0.34,<2"
      - name: Fetch spent validation only
        run: |
          python research/scripts/fetch_iris_freefall_rescue_v6.py             --data-root build/public-datasets             --config research/validation/iris_freefall_rescue_v6.json             --phase validation
      - name: Run seeded tracker on spent validation only
        run: |
          python - <<'PY' | tee build/v67-seeded-validation.log
          import importlib.util, json, pathlib, numpy as np
          p=pathlib.Path("research/scripts/diagnose_iris_freefall_v67_seeded_track.py")
          spec=importlib.util.spec_from_file_location("seeded",p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          mod=m.load(m.ANALYZER,"v67_q_analyzer")
          diag=m.load(m.TRACK_DIAG,"v67_q_diag")
          cfgj=json.loads(pathlib.Path("research/validation/iris_freefall_rescue_v6.json").read_text())
          cfg=dict(cfgj["tracker"])
          ds=cfgj["dataset"]["validation"]
          setting=ds["setting"]
          h=float(cfgj["physics"]["drop_heights_m"][setting])
          rows=[]
          for take in ds["takes"]:
              video=pathlib.Path("build/public-datasets/iris/Dropping_ball")/setting/f"{take}.mp4"
              try:
                  r=m.run_take(mod,diag,video,cfg,640,h)
                  if "gerr" in r:
                      rows.append(r)
                      print(f"{setting}/{take} event={r['s']}->{r['e']} t0={r['t0_frame']:.2f} T={r['T']:.4f} T/Ttruth={r['T']/r['T_truth']:.3f} shape={r['shape']:.4f} terminal={r['terminal']:.3f} gerr={r['gerr']:.3f} tracked={r['tracked']}")
                  else:
                      print(f"{setting}/{take} NO_EVENT tracked={r['tracked']} score={r['mean_score']:.3f}")
              except Exception as e:
                  print(f"{setting}/{take} ERROR {type(e).__name__}: {e}")
          if rows:
              errs=[r["gerr"] for r in rows]
              ratios=[r["T"]/r["T_truth"] for r in rows]
              print("SUMMARY validation n",len(rows),
                    "median_gerr",float(np.median(errs)),
                    "max_gerr",float(np.max(errs)),
                    "median_T_ratio",float(np.median(ratios)))
          else:
              print("SUMMARY validation n 0")
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-v67-seeded-validation
          path: build/v67-seeded-validation.log
          if-no-files-found: warn
