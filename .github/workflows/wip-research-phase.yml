name: WIP Research Phase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wip-research-phase.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply research phase
        run: python scripts/apply_research_phase.py
      - name: Remove one-shot phase machinery
        run: |
          rm .github/workflows/wip-research-phase.yml
          rm scripts/apply_research_phase.py
      - name: Commit phase
        run: |
          git config user.name "Vulkax Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add dynamic operator influence and research planning"
          git push origin HEAD:main
