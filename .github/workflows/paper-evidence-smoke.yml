name: Vulkax paper-evidence smoke

on:
  push:
    branches: ["research/integration-20260920"]
    paths:
      - "run_everything.sh"
      - "README.md"
      - "research/analysis/**"
      - "research/paper_data/**"
      - "research/results/**"
      - ".github/workflows/paper-evidence-smoke.yml"
  workflow_dispatch:

concurrency:
  group: vulkax-paper-evidence-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n run_everything.sh

      - name: Validate paper/research Python tooling
        run: |
          python3 -m py_compile             research/analysis/assemble_paper_evidence.py             research/analysis/generate_paper_assets.py             research/analysis/validate_paper_reproduction.py             research/analysis/dcs_confirmatory_replay.py             research/analysis/export_dcs_spatial_map.py             research/analysis/export_dcs_evidence_pack.py             research/analysis/gauge_dcs_retrospective.py \
            research/analysis/analyze_information_frontier.py

      - name: Self-test paper/research tooling
        run: |
          python3 research/analysis/assemble_paper_evidence.py --self-test
          python3 research/analysis/generate_paper_assets.py --self-test
          python3 research/analysis/validate_paper_reproduction.py --self-test
          python3 research/analysis/dcs_confirmatory_replay.py --self-test
          python3 research/analysis/export_dcs_spatial_map.py --self-test
          python3 research/analysis/export_dcs_evidence_pack.py --self-test
          python3 research/analysis/analyze_information_frontier.py --self-test

      - name: Validate committed JSON ledgers
        run: |
          python3 - <<'PY'
          import json
          for p in (
              "research/results/DCS_FINAL_RESULTS_2026-09-20.json",
              "research/paper_data/PAPER_DATA_MANIFEST.json",
              "research/hypotheses/priority_queue.json",
          ):
              json.load(open(p))
              print("VALID JSON",p)
          PY

      - name: Audit release-facing README claims
        run: |
          python3 scripts/validate_evidence_registry.py .
          python3 scripts/audit_release_claims.py . --expected-project-version 1.0.0

      - name: Generate deterministic paper assets
        run: |
          python3 research/analysis/generate_paper_assets.py             --results research/results/DCS_FINAL_RESULTS_2026-09-20.json             --out build/paper-figures
          test -f build/paper-figures/figure_manifest.json
          test -f build/paper-figures/fig_ranking_agreement.svg

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVULKAX_BUILD_TESTS=ON

      - name: Build core DCS smoke targets
        run: |
          cmake --build build --target             vulkax             vulkax_dark_field_counterfactual_tests             vulkax_dcs_darkfield_synthetic_probe             --parallel 2

      - name: Run DCS mathematical regression
        run: ctest --test-dir build --output-on-failure -R '^vulkax_dark_field_counterfactual$'

      - name: Run deterministic D1 control
        run: |
          build/vulkax_dcs_darkfield_synthetic_probe build/dcs-positive-control
          python3 research/probes/analyze_dcs_darkfield.py build/dcs-positive-control
          cat build/dcs-positive-control/analysis.json
