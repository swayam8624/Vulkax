name: Promote Studio model split after validation
on:
  push:
    branches: [fix/split-native-studio-model]
permissions:
  contents: write
  pull-requests: write
jobs:
  ready:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {ref: fix/split-native-studio-model}
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          test -e apps/VulkaxPhysicsStudioMac/Sources/VulkaxPhysicsStudioMac/PhysicsModel.swift || exit 0
          test ! -e .github/workflows/wip-split-native-studio-model.yml || exit 0
          rm -f .github/workflows/ready-split-native-studio-model.yml .github/workflows/cleanup-split-native-studio-model.yml
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -m "Finalize native Studio model split"; git push origin HEAD:fix/split-native-studio-model
          gh pr ready 30 --repo swayam8624/Vulkax
