name: WIP vulkax_gpu linkage

on:
  push:
    branches:
      - fix/vulkax-gpu-linkage

permissions:
  contents: write

jobs:
  link-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/vulkax-gpu-linkage
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libglfw3-dev libglm-dev \
            nlohmann-json3-dev libsqlite3-dev libvulkan-dev vulkan-tools mesa-vulkan-drivers \
            libcurl4-openssl-dev glslang-tools pkg-config libopenexr-dev
      - name: Wire vulkax_gpu target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('CMakeLists.txt')
          text=path.read_text()
          runtime='''add_library(vulkax_runtime_paths STATIC src/runtime_paths.cpp)\ntarget_compile_features(vulkax_runtime_paths PUBLIC cxx_std_20)\ntarget_include_directories(vulkax_runtime_paths PUBLIC ${PROJECT_SOURCE_DIR}/src)\n'''
          block=runtime+'''\nadd_library(vulkax_gpu STATIC src/vulkax/gpu/vulkan_compute_context.cpp)\ntarget_compile_features(vulkax_gpu PUBLIC cxx_std_20)\ntarget_include_directories(vulkax_gpu PUBLIC ${PROJECT_SOURCE_DIR}/src)\ntarget_link_libraries(vulkax_gpu PUBLIC Vulkan::Vulkan)\n'''
          if 'add_library(vulkax_gpu STATIC src/vulkax/gpu/vulkan_compute_context.cpp)' not in text:
              if runtime not in text: raise SystemExit('runtime target marker missing')
              text=text.replace(runtime,block,1)
          old='target_link_libraries(VulkaxComputeBenchmark PRIVATE Vulkan::Vulkan vulkax_runtime_paths)'
          if old in text:
              text=text.replace(old,'target_link_libraries(VulkaxComputeBenchmark PRIVATE vulkax_gpu vulkax_runtime_paths)',1)
          elif 'target_link_libraries(VulkaxComputeBenchmark PRIVATE vulkax_gpu vulkax_runtime_paths)' not in text:
              raise SystemExit('compute benchmark link marker missing')
          path.write_text(text)
          PY
      - name: Configure and build
        run: >-
          cmake -S . -B build-gpu -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DVULKAX_BUILD_PHYSICS_STUDIO=OFF
      - name: Build migrated compute tool
        run: cmake --build build-gpu --target VulkaxComputeBenchmark PhysicsIrTests
      - name: Resolve Lavapipe
        run: |
          LVP_ICD="$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -type f -name 'lvp_icd*.json' -print -quit 2>/dev/null)"
          test -n "$LVP_ICD"
          echo "VK_DRIVER_FILES=$LVP_ICD" >> "$GITHUB_ENV"
      - name: Run reusable context compute smoke
        run: build-gpu/vulkax-compute --width 32 --height 18 --output /tmp/vulkax-gpu-context
      - name: Run Physics IR tests
        run: ctest --test-dir build-gpu -R '^physics_ir$' --output-on-failure
      - name: Commit final CMake linkage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git diff --cached --check
          git commit -m "Wire reusable vulkax_gpu compute context"
          git push origin HEAD:fix/vulkax-gpu-linkage
