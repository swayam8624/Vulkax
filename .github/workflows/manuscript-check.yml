name: Reality Probe manuscript compile check

on:
  push:
    branches: ["feat/**"]
    paths:
      - "paper/main.tex"
      - "paper/main_humanized.tex"
      - "paper/references.bib"
      - ".github/workflows/manuscript-check.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "paper/**"
      - ".github/workflows/manuscript-check.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-extra texlive-science texlive-publishers
      - name: Compile canonical manuscript
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Compile prose-edited manuscript
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error main_humanized.tex
