name: Cleanup direct Vulkan validation scaffolding

on:
  push:
    branches:
      - fix/direct-vulkan-validation-ci

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/direct-vulkan-validation-ci
      - name: Remove WIP workflow after permanent analysis coverage exists
        run: |
          if ! grep -q 'Run direct Physics Studio validation smokes' .github/workflows/analysis.yml; then
            echo 'Permanent direct validation coverage has not landed yet.'
            exit 0
          fi
          rm -f .github/workflows/wip-direct-vulkan-validation.yml
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove direct Vulkan validation scaffolding"
          git push origin HEAD:fix/direct-vulkan-validation-ci
