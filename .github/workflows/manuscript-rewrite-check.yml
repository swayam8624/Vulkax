name: Reality Probe manuscript rewrite check

on:
  push:
    branches:
      - manuscript/reality-probe-rewrite-2026-09-24
    paths:
      - paper/main.tex
      - paper/main_humanized.tex
      - paper/references.bib
      - .github/workflows/manuscript-rewrite-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Manuscript evidence and structure guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path("paper/main.tex").read_text()
          b=Path("paper/main_humanized.tex").read_text()
          assert a == b, "manuscript sources diverged"
          required = [
              "90/110",
              "40/110",
              "40/50",
              "111.7\\%",
              "11.46",
              "10 physical videos",
              "drop\\_150/02..10",
              "permanently retrospective",
              "UNRESOLVED",
          ]
          for token in required:
              assert token in a, token
          forbidden = [
              "preregistered",
              "universal verifier",
              "successful free-fall",
              "220 independent",
          ]
          low=a.lower()
          for token in forbidden:
              assert token not in low, token
          assert a.count("\\begin{abstract}") == 1
          assert a.count("\\end{abstract}") == 1
          print("VALID manuscript evidence/structure guard")
          PY

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-extra texlive-science texlive-publishers

      - name: Compile canonical source
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Compile synchronized source
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error main_humanized.tex

      - name: Check citations, references, and overflow
        run: |
          cd paper
          for log in main.log main_humanized.log; do
            if grep -E "Undefined control sequence|LaTeX Error|Citation .* undefined|Reference .* undefined" "$log"; then
              echo "fatal manuscript warning in $log" >&2
              exit 1
            fi
            echo "---- layout warnings: $log ----"
            grep -E "Overfull \\hbox|Overfull \\vbox|Underfull \\hbox" "$log" || true
          done
          echo "VALID both manuscript sources compile"
