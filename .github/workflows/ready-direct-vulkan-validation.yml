name: Promote direct Vulkan validation PR
on:
  push:
    branches: [fix/direct-vulkan-validation-ci]
permissions:
  contents: write
  pull-requests: write
jobs:
  ready:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {ref: fix/direct-vulkan-validation-ci}
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          grep -q 'Run direct Physics Studio validation smokes' .github/workflows/analysis.yml || exit 0
          test ! -e .github/workflows/wip-direct-vulkan-validation.yml || exit 0
          rm -f .github/workflows/ready-direct-vulkan-validation.yml .github/workflows/cleanup-direct-vulkan-validation.yml
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -m "Finalize direct Vulkan validation coverage"; git push origin HEAD:fix/direct-vulkan-validation-ci
          gh pr ready 29 --repo swayam8624/Vulkax
