name: WIP tensor Physics IR

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libvulkan-dev glslang-tools \
            libglfw3-dev libglm-dev nlohmann-json3-dev libsqlite3-dev libcurl4-openssl-dev \
            pkg-config libopenexr-dev
      - name: Wire tensor IR
        run: python3 scripts/wire_tensor_ir.py
      - name: Configure
        run: >-
          cmake -S . -B build-tensor -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DVULKAX_BUILD_PHYSICS_STUDIO=OFF
      - name: Build and test scalar, vector and tensor IR
        run: |
          cmake --build build-tensor --target PhysicsIrTests TensorComputeIrTests
          ctest --test-dir build-tensor -R '^(physics_ir|tensor_compute_ir)$' --output-on-failure
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt cmake/VulkaxTests.cmake
          git diff --cached --check
          git commit -m "Integrate vector and tensor compute IR"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
