name: WIP Verification Docs Phase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wip-verification-docs-phase.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply verification and docs phase
        run: python scripts/apply_verification_docs_phase.py
      - name: Remove one-shot machinery
        run: |
          rm .github/workflows/wip-verification-docs-phase.yml
          rm scripts/apply_verification_docs_phase.py
      - name: Commit phase
        run: |
          git config user.name "Vulkax Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add manufactured verification and current Vulkax documentation"
          git push origin HEAD:main
