name: Video observation reality loop

on:
  pull_request:
    paths:
      - "include/vulkax/world/**"
      - "include/vulkax/capture/video_track.hpp"
      - "src/world/**"
      - "src/research/captured_reality_loop.cpp"
      - "src/tools/reality_video_seed.cpp"
      - "tests/reality_loop_tests.cpp"
      - "tests/pinhole_camera_tests.cpp"
      - "tests/bouncing_video_reality_loop_tests.cpp"
      - "tests/image_plane_bounce_tests.cpp"
      - "scripts/extract_video_track.py"
      - "scripts/fetch_reality_video_assets.py"
      - "scripts/test_video_track_extractor.py"
      - "assets/reality/**"
      - ".github/workflows/video-observation.yml"
  push:
    branches: [main]
    paths:
      - "include/vulkax/world/**"
      - "include/vulkax/capture/video_track.hpp"
      - "src/world/**"
      - "src/research/captured_reality_loop.cpp"
      - "src/tools/reality_video_seed.cpp"
      - "tests/reality_loop_tests.cpp"
      - "tests/pinhole_camera_tests.cpp"
      - "tests/bouncing_video_reality_loop_tests.cpp"
      - "tests/image_plane_bounce_tests.cpp"
      - "scripts/extract_video_track.py"
      - "scripts/fetch_reality_video_assets.py"
      - "scripts/test_video_track_extractor.py"
      - "assets/reality/**"
      - ".github/workflows/video-observation.yml"

jobs:
  video-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install video toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate mechanism-tagged video source manifest
        run: |
          python3 scripts/fetch_reality_video_assets.py --validate-only \
            --asset-id golhamedia_bouncy_ball_240fps_2016
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("assets/reality/video_sources.lock.json").read_text())
          by_id = {asset["id"]: asset for asset in data["assets"]}
          ballistic = by_id["golhamedia_bouncy_ball_240fps_2016"]
          electrostatic = by_id["sciencecola_electrostatic_ball_2013"]
          if ballistic["mechanism"] != "ballistic_ground_contact":
              raise SystemExit("ballistic benchmark source has the wrong mechanism tag")
          if electrostatic["mechanism"] == ballistic["mechanism"]:
              raise SystemExit("visually similar but physically different sources collapsed to one model family")
          print("VALID explicit observation-source mechanism boundary")
          PY

      - name: Exercise synthetic raw-video to point-track extraction
        run: python3 scripts/test_video_track_extractor.py

      - name: Fetch checksum-pinned ballistic ground-contact footage
        run: |
          python3 scripts/fetch_reality_video_assets.py \
            --asset-id golhamedia_bouncy_ball_240fps_2016

      - name: Derive measured-source ballistic image-plane track
        run: |
          mkdir -p build/reality-real
          python3 scripts/extract_video_track.py \
            build/reality-assets/video/golhamedia_bouncy_ball_240fps_2016.webm \
            build/reality-real/golhamedia_bouncy_ball.track.csv \
            --source "https://commons.wikimedia.org/wiki/File:Bouncy_ball_240fps.webm" \
            --fps 24 --scale-width 480 --threshold 18 --motion-threshold 8 \
            --min-component-pixels 10 --max-component-fraction 0.02 \
            --max-aspect-ratio 3.5 --min-motion-fraction 0.04 \
            --max-displacement-fraction 0.10 --validation-stride 5 --max-frames 600
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -i build/reality-assets/video/golhamedia_bouncy_ball_240fps_2016.webm \
            -vf "fps=1,scale=480:-2,tile=5x5:padding=2:margin=2" -frames:v 1 \
            build/reality-real/golhamedia_bouncy_ball.contact_sheet.png

      - name: Build measured-source image-plane seed tool
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Iinclude src/tools/reality_video_seed.cpp src/numerics/dense.cpp \
            -o build/vulkax_reality_video_seed

      - name: Initialize measured-source ballistic hypothesis
        run: |
          build/vulkax_reality_video_seed \
            build/reality-real/golhamedia_bouncy_ball.track.csv \
            | tee build/reality-real/golhamedia_bouncy_ball.seed.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("build/reality-real/golhamedia_bouncy_ball.seed.json")
          seed = json.loads(path.read_text(encoding="utf-8"))
          if seed.get("schema") != "vulkax_image_plane_bounce_seed" or seed.get("version") != 2:
              raise SystemExit("unexpected measured-source seed schema")
          if seed["sample_count"] < 20 or seed["fit_samples"] == 0 or seed["validation_samples"] == 0:
              raise SystemExit("real-video tracker did not produce a usable fit/validation evidence set")
          if seed["y_span_pixels"] < 0.08 * seed["height_pixels"]:
              raise SystemExit("tracked evidence does not contain enough vertical motion for ground-contact inference")
          if not (0.0 < seed["ground_y_pixels"] < seed["height_pixels"]):
              raise SystemExit("image-plane ground estimate lies outside the extracted frame")
          if not (0.5 < seed["acceleration_y_pixels_per_second2"] < 1.0e6):
              raise SystemExit("image-plane acceleration proxy is too small/large to support the bounce model")
          if not (0.05 < seed["restitution_proxy"] < 0.985):
              raise SystemExit("restitution proxy hit/approached a clamp boundary; reject weak impact evidence")
          if seed["first_bounce_sample"] is None or seed["release_sample"] is None:
              raise SystemExit("real-video initializer failed to identify release/bounce events")
          if not (0.0 <= seed["release_time_seconds"] < seed["first_bounce_time_seconds"]):
              raise SystemExit("release/bounce event ordering is invalid")
          if seed["first_bounce_time_seconds"] - seed["release_time_seconds"] < 0.1:
              raise SystemExit("release-to-impact interval is too short for a defensible ballistic seed")
          if "pixels/s^2" not in seed["metric_status"]:
              raise SystemExit("measured-source seed lost its non-metric evidence caveat")
          print("VALID measured-source ballistic image-plane hypothesis bootstrap")
          PY

      - name: Upload measured-source derived evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkax-real-ballistic-video-bootstrap
          path: |
            build/reality-real/golhamedia_bouncy_ball.track.csv
            build/reality-real/golhamedia_bouncy_ball.seed.json
            build/reality-real/golhamedia_bouncy_ball.contact_sheet.png
          if-no-files-found: warn

      - name: Upload source clip for failed observation-producer debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vulkax-real-ballistic-source-debug
          path: build/reality-assets/video/golhamedia_bouncy_ball_240fps_2016.webm
          if-no-files-found: warn

      - name: Configure Vulkax
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVULKAX_BUILD_TESTS=ON

      - name: Build typed reality-loop regression
        run: cmake --build build --target vulkax_reality_loop_tests --parallel 2

      - name: Run typed reality-loop regression
        run: ctest --test-dir build --output-on-failure -R '^vulkax_reality_loop$'

      - name: Build camera-calibration reality-loop regression
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -UNDEBUG \
            -Iinclude tests/pinhole_camera_tests.cpp \
            src/world/world_ir.cpp src/world/reality_loop.cpp src/numerics/dense.cpp \
            -o build/vulkax_pinhole_camera_tests

      - name: Run camera-calibration reality-loop regression
        run: build/vulkax_pinhole_camera_tests

      - name: Build video-to-physics bounce regression
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -UNDEBUG \
            -Iinclude tests/bouncing_video_reality_loop_tests.cpp \
            src/world/world_ir.cpp src/world/reality_loop.cpp src/numerics/dense.cpp \
            -o build/vulkax_bouncing_video_reality_loop_tests

      - name: Run video-to-physics bounce regression
        run: build/vulkax_bouncing_video_reality_loop_tests

      - name: Build monocular image-plane initializer regression
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -UNDEBUG \
            -Iinclude tests/image_plane_bounce_tests.cpp \
            src/world/world_ir.cpp src/world/reality_loop.cpp src/numerics/dense.cpp \
            -o build/vulkax_image_plane_bounce_tests

      - name: Run monocular image-plane initializer regression
        run: build/vulkax_image_plane_bounce_tests
