name: Vulkax CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: vulkax-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan runtime and shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers glslang-tools
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVULKAX_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Captured bundle contract end to end
        run: |
          ./build/vulkax captured-deformable-generate-example build/captured-example
          test -s build/captured-example/capture.vkcap
          test -s build/captured-example/uncertainty.csv
          ./build/vulkax captured-deformable-validate-bundle \
            build/captured-example/capture.vkcap | tee build/captured-bundle-validation.txt
          grep -q '^VALID captured deformable bundle$' build/captured-bundle-validation.txt
          grep -q 'source_kind: synthetic' build/captured-bundle-validation.txt
          grep -q 'physical_particles: 64' build/captured-bundle-validation.txt
          grep -q 'observations: 20' build/captured-bundle-validation.txt
          grep -q 'uncertainty_rows: 20' build/captured-bundle-validation.txt

          ./build/vulkax captured-deformable-author-bundle \
            build/captured-example/authored.vkcap \
            build/captured-example/object.ply \
            build/captured-example/particles.csv \
            build/captured-example/observations.csv \
            build/captured-example/uncertainty.csv \
            ci-re-authored-controlled 1e-4 controlled-world right-handed-y-up derived \
            'CI re-authoring of deterministic synthetic payloads; no measurement claim' \
            | tee build/captured-bundle-authoring.txt
          test -s build/captured-example/authored.vkcap
          grep -q '^AUTHORED captured deformable bundle$' build/captured-bundle-authoring.txt
          grep -q 'source_kind: derived' build/captured-bundle-authoring.txt
          grep -q 'payloads_modified: no' build/captured-bundle-authoring.txt
          ./build/vulkax captured-deformable-validate-bundle \
            build/captured-example/authored.vkcap | tee build/captured-bundle-authored-validation.txt
          grep -q 'source_kind: derived' build/captured-bundle-authored-validation.txt
          grep -q 'physical_particles: 64' build/captured-bundle-authored-validation.txt
          grep -q 'observations: 20' build/captured-bundle-authored-validation.txt

          cp -R build/captured-example build/captured-example-corrupt
          echo '# CI hash mutation' >> build/captured-example-corrupt/observations.csv
          if ./build/vulkax captured-deformable-validate-bundle \
              build/captured-example-corrupt/capture.vkcap \
              > build/captured-bundle-corrupt.txt 2>&1; then
            echo 'corrupted captured bundle unexpectedly validated'
            exit 1
          fi
          grep -q 'SHA-256 mismatch' build/captured-bundle-corrupt.txt
      - name: Captured deformable calibration end to end
        run: |
          ./build/vulkax captured-material-calibrate \
            build/captured-example/object.ply \
            build/captured-example/particles.csv \
            build/captured-example/observations.csv \
            build/captured-calibration \
            1e-4 0.08
          test -s build/captured-calibration/material_grid.csv
          test -s build/captured-calibration/selected_summary.csv
          awk -F, '$1 == 15000 && $2 > 0.299999 && $2 < 0.300001 && $12 == 1 { found = 1 } END { exit !found }' \
            build/captured-calibration/material_grid.csv
      - name: Captured material Operator Influence end to end
        run: |
          ./build/vulkax captured-material-influence \
            build/captured-example/object.ply \
            build/captured-example/particles.csv \
            build/captured-example/observations.csv \
            build/captured-influence \
            m4 0.003 1 1 1 \
            1e-4 15000 0.30 0.08 0.01 0.02
          test -s build/captured-influence/influence.csv
          test -s build/captured-influence/counterfactual.csv
          test -s build/captured-influence/adjoint_influence.csv
          test -s build/captured-influence/particle_adjoint.csv
          test -s build/captured-influence/derivative_comparison.csv
          test -s build/captured-influence/adaptive_proposal_summary.csv
          test -s build/captured-influence/adaptive_influence.csv
          test -s build/captured-influence/adaptive_counterfactual.csv
          test -s build/captured-influence/adaptive_adjoint_influence.csv
          test -s build/captured-influence/adaptive_derivative_comparison.csv
          test -s build/captured-influence/baseline_summary.csv
          awk -F, 'NR > 1 { value=$10; if (value < 0) value=-value; if (value > 1e-7) found=1 } END { exit !found }' \
            build/captured-influence/influence.csv
          awk -F, 'NR > 1 { if ($7 > max) max=$7 } END { exit !(max < 0.25) }' \
            build/captured-influence/counterfactual.csv
          awk -F, 'NR > 1 { value=$2; if (value < 0) value=-value; if (value > 1e-8) found=1 } END { exit !found }' \
            build/captured-influence/particle_adjoint.csv
          awk -F, 'NR > 1 { if ($4 > max) max=$4 } END { exit !(max < 1e-8) }' \
            build/captured-influence/derivative_comparison.csv
          awk -F, 'NR > 1 { ref=$2; if (ref < 0) ref=-ref; if (ref > 1e-7 && $5 > max) max=$5 } END { exit !(max < 0.005) }' \
            build/captured-influence/derivative_comparison.csv
          awk -F, 'NR == 2 { exit !($1 >= 1 && $3 > 0 && $3 < 64 && $6 >= 0.90 && $8 >= 0.90) }' \
            build/captured-influence/adaptive_proposal_summary.csv
          awk -F, 'NR > 1 { value=$10; if (value < 0) value=-value; if (value > 1e-7) found=1 } END { exit !found }' \
            build/captured-influence/adaptive_influence.csv
          awk -F, 'NR > 1 { if ($7 > max) max=$7 } END { exit !(max < 0.25) }' \
            build/captured-influence/adaptive_counterfactual.csv
          awk -F, 'NR > 1 { if ($4 > max) max=$4 } END { exit !(max < 1e-8) }' \
            build/captured-influence/adaptive_derivative_comparison.csv
          awk -F, 'NR > 1 { ref=$2; if (ref < 0) ref=-ref; if (ref > 1e-7 && $5 > max) max=$5 } END { exit !(max < 0.005) }' \
            build/captured-influence/adaptive_derivative_comparison.csv
      - name: Captured observation robustness end to end
        run: |
          ./build/vulkax captured-observation-robustness \
            build/captured-example/object.ply \
            build/captured-example/particles.csv \
            build/captured-example/observations.csv \
            build/captured-robustness-a \
            m4 0.003 1 1 1 \
            1e-6 1e-6 12345 1e-4 0.08
          ./build/vulkax captured-observation-robustness \
            build/captured-example/object.ply \
            build/captured-example/particles.csv \
            build/captured-example/observations.csv \
            build/captured-robustness-b \
            m4 0.003 1 1 1 \
            1e-6 1e-6 12345 1e-4 0.08
          test -s build/captured-robustness-a/robustness.csv
          test -s build/captured-robustness-a/scenarios.csv
          cmp build/captured-robustness-a/robustness.csv build/captured-robustness-b/robustness.csv
          cmp build/captured-robustness-a/scenarios.csv build/captured-robustness-b/scenarios.csv
          test "$(wc -l < build/captured-robustness-a/robustness.csv)" -eq 7
          ! grep -Eiq '(^|,)(nan|-?inf)(,|$)' build/captured-robustness-a/robustness.csv
          awk -F, 'NR == 2 { exit !($1 == "baseline" && $5 == 15000 && $6 > 0.299999 && $6 < 0.300001 && $7 == 0 && $8 == 0 && $13 == 1 && $14 == 0 && $16 == 1 && $21 == 1) }' \
            build/captured-robustness-a/robustness.csv
          awk -F, 'NR > 2 && $14 > 0 { changed = 1 } END { exit !changed }' \
            build/captured-robustness-a/robustness.csv
      - name: Validate example problems
        run: |
          ./build/vulkax validate examples/rotating_mill.vkx
          ./build/vulkax validate examples/car_aerodynamics.vkx
          ./build/vulkax validate examples/rubber_inverse.vkx
      - name: Runtime Vulkan discovery
        run: ./build/vulkax --require-backend Vulkan
      - name: Vulkan compute conformance
        run: ./build/vulkax --conformance Vulkan
      - name: Gaussian scene ingestion and native Vulkan render
        run: |
          ./build/vulkax gaussian-info examples/synthetic_gaussian.ply
          ./build/vulkax gaussian-render examples/synthetic_gaussian.ply build/gaussian-vulkan.ppm Vulkan
          test -s build/gaussian-vulkan.ppm
      - name: Gaussian scalable Vulkan evidence
        run: |
          ./build/vulkax_gaussian_scaling \
            examples/synthetic_gaussian.ply \
            build/gaussian-scaling-vulkan.csv \
            Vulkan 64 256 3 16
          test -s build/gaussian-scaling-vulkan.csv
          test "$(wc -l < build/gaussian-scaling-vulkan.csv)" -eq 4
          ! grep -Eiq '(^|,)(nan|-?inf)(,|$)' build/gaussian-scaling-vulkan.csv
          awk -F, 'NR > 1 { if ($3 <= 0 || $4 <= 0 || $5 <= 0 || $6 <= 0 || $7 <= 0 || $8 < 0 || $9 < 0 || $10 < 0 || $11 > 2 || $12 >= 0.5 || $14 >= 0.05 || $15 != 1) bad=1; if (NR > 2 && $5 <= prev) bad=1; prev=$5 } END { exit bad }' \
            build/gaussian-scaling-vulkan.csv

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVULKAX_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Validate example problems
        run: |
          ./build/vulkax validate examples/rotating_mill.vkx
          ./build/vulkax validate examples/car_aerodynamics.vkx
          ./build/vulkax validate examples/rubber_inverse.vkx
      - name: Runtime Metal discovery
        run: ./build/vulkax --require-backend Metal
      - name: Metal compute conformance
        run: ./build/vulkax --conformance Metal
      - name: Gaussian scene ingestion and native Metal render
        run: |
          ./build/vulkax gaussian-info examples/synthetic_gaussian.ply
          ./build/vulkax gaussian-render examples/synthetic_gaussian.ply build/gaussian-metal.ppm Metal
          test -s build/gaussian-metal.ppm
      - name: Gaussian scalable Metal evidence
        run: |
          ./build/vulkax_gaussian_scaling \
            examples/synthetic_gaussian.ply \
            build/gaussian-scaling-metal.csv \
            Metal 64 256 3 16
          test -s build/gaussian-scaling-metal.csv
          test "$(wc -l < build/gaussian-scaling-metal.csv)" -eq 4
          ! grep -Eiq '(^|,)(nan|-?inf)(,|$)' build/gaussian-scaling-metal.csv
          awk -F, 'NR > 1 { if ($3 <= 0 || $4 <= 0 || $5 <= 0 || $6 <= 0 || $7 <= 0 || $8 < 0 || $9 < 0 || $10 < 0 || $11 > 2 || $12 >= 0.5 || $14 >= 0.05 || $15 != 1) bad=1; if (NR > 2 && $5 <= prev) bad=1; prev=$5 } END { exit bad }' \
            build/gaussian-scaling-metal.csv

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DVULKAX_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate example problems
        run: |
          .\build\Release\vulkax.exe validate examples\rotating_mill.vkx
          .\build\Release\vulkax.exe validate examples\car_aerodynamics.vkx
          .\build\Release\vulkax.exe validate examples\rubber_inverse.vkx
      - name: Gaussian scene ingestion
        run: .\build\Release\vulkax.exe gaussian-info examples\synthetic_gaussian.ply