name: Vulkax CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: vulkax-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan runtime and shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers glslang-tools
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVULKAX_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Captured deformable calibration end to end
        run: |
          ./build/vulkax captured-deformable-generate-example build/captured-example
          ./build/vulkax captured-material-calibrate \
            build/captured-example/object.ply \
            build/captured-example/particles.csv \
            build/captured-example/observations.csv \
            build/captured-calibration \
            1e-4 0.08
          test -s build/captured-calibration/material_grid.csv
          test -s build/captured-calibration/selected_summary.csv
          awk -F, '$1 == 15000 && $2 > 0.299999 && $2 < 0.300001 && $12 == 1 { found = 1 } END { exit !found }' \
            build/captured-calibration/material_grid.csv
      - name: Captured material Operator Influence end to end
        run: |
          ./build/vulkax captured-material-influence \
            build/captured-example/object.ply \
            build/captured-example/particles.csv \
            build/captured-example/observations.csv \
            build/captured-influence \
            m4 0.003 1 1 1 \
            1e-4 15000 0.30 0.08 0.01 0.02
          test -s build/captured-influence/influence.csv
          test -s build/captured-influence/counterfactual.csv
          test -s build/captured-influence/adjoint_influence.csv
          test -s build/captured-influence/particle_adjoint.csv
          test -s build/captured-influence/derivative_comparison.csv
          test -s build/captured-influence/adaptive_proposal_summary.csv
          test -s build/captured-influence/adaptive_influence.csv
          test -s build/captured-influence/adaptive_counterfactual.csv
          test -s build/captured-influence/adaptive_adjoint_influence.csv
          test -s build/captured-influence/adaptive_derivative_comparison.csv
          test -s build/captured-influence/baseline_summary.csv
          awk -F, 'NR > 1 { value=$10; if (value < 0) value=-value; if (value > 1e-7) found=1 } END { exit !found }' \
            build/captured-influence/influence.csv
          awk -F, 'NR > 1 { if ($7 > max) max=$7 } END { exit !(max < 0.25) }' \
            build/captured-influence/counterfactual.csv
          awk -F, 'NR > 1 { value=$2; if (value < 0) value=-value; if (value > 1e-8) found=1 } END { exit !found }' \
            build/captured-influence/particle_adjoint.csv
          awk -F, 'NR > 1 { if ($4 > max) max=$4 } END { exit !(max < 1e-8) }' \
            build/captured-influence/derivative_comparison.csv
          awk -F, 'NR > 1 { ref=$2; if (ref < 0) ref=-ref; if (ref > 1e-7 && $5 > max) max=$5 } END { exit !(max < 0.005) }' \
            build/captured-influence/derivative_comparison.csv
          awk -F, 'NR == 2 { exit !($1 >= 1 && $3 > 0 && $3 < 64 && $6 >= 0.90 && $8 >= 0.90) }' \
            build/captured-influence/adaptive_proposal_summary.csv
          awk -F, 'NR > 1 { value=$10; if (value < 0) value=-value; if (value > 1e-7) found=1 } END { exit !found }' \
            build/captured-influence/adaptive_influence.csv
          awk -F, 'NR > 1 { if ($7 > max) max=$7 } END { exit !(max < 0.25) }' \
            build/captured-influence/adaptive_counterfactual.csv
          awk -F, 'NR > 1 { if ($4 > max) max=$4 } END { exit !(max < 1e-8) }' \
            build/captured-influence/adaptive_derivative_comparison.csv
          awk -F, 'NR > 1 { ref=$2; if (ref < 0) ref=-ref; if (ref > 1e-7 && $5 > max) max=$5 } END { exit !(max < 0.005) }' \
            build/captured-influence/adaptive_derivative_comparison.csv
      - name: Validate example problems
        run: |
          ./build/vulkax validate examples/rotating_mill.vkx
          ./build/vulkax validate examples/car_aerodynamics.vkx
          ./build/vulkax validate examples/rubber_inverse.vkx
      - name: Runtime Vulkan discovery
        run: ./build/vulkax --require-backend Vulkan
      - name: Vulkan compute conformance
        run: ./build/vulkax --conformance Vulkan
      - name: Gaussian scene ingestion and native Vulkan render
        run: |
          ./build/vulkax gaussian-info examples/synthetic_gaussian.ply
          ./build/vulkax gaussian-render examples/synthetic_gaussian.ply build/gaussian-vulkan.ppm Vulkan
          test -s build/gaussian-vulkan.ppm

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVULKAX_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Validate example problems
        run: |
          ./build/vulkax validate examples/rotating_mill.vkx
          ./build/vulkax validate examples/car_aerodynamics.vkx
          ./build/vulkax validate examples/rubber_inverse.vkx
      - name: Runtime Metal discovery
        run: ./build/vulkax --require-backend Metal
      - name: Metal compute conformance
        run: ./build/vulkax --conformance Metal
      - name: Gaussian scene ingestion and native Metal render
        run: |
          ./build/vulkax gaussian-info examples/synthetic_gaussian.ply
          ./build/vulkax gaussian-render examples/synthetic_gaussian.ply build/gaussian-metal.ppm Metal
          test -s build/gaussian-metal.ppm

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DVULKAX_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate example problems
        run: |
          .\build\Release\vulkax.exe validate examples\rotating_mill.vkx
          .\build\Release\vulkax.exe validate examples\car_aerodynamics.vkx
          .\build\Release\vulkax.exe validate examples\rubber_inverse.vkx
      - name: Gaussian scene ingestion
        run: .\build\Release\vulkax.exe gaussian-info examples\synthetic_gaussian.ply