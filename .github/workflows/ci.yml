name: Vulkax Next CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Vulkan compute toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers glslang-tools
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVULKAX_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Runtime Vulkan discovery
        run: ./build/vulkax --require-backend Vulkan
      - name: Vulkan ComputeIR conformance
        run: ./build/vulkax_compute_tests Vulkan
      - name: Vulkan spatial-hash DEM
        run: ./build/vulkax_gpu_physics_tests Vulkan
      - name: Generate scientific reference suite
        run: ./build/vulkax-lab suite --output build/reference-suite --particles 320 --steps 80 --dt 0.0002
      - uses: actions/upload-artifact@v4
        with:
          name: vulkax-next-reference-suite
          path: build/reference-suite

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVULKAX_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Runtime Metal discovery
        run: ./build/vulkax --require-backend Metal
      - name: Metal ComputeIR conformance
        run: ./build/vulkax_compute_tests Metal

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -DVULKAX_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
