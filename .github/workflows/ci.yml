name: Vulkax CI

on:
  push:
  pull_request:

jobs:
  linux-vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libglfw3-dev libglm-dev \
            nlohmann-json3-dev libsqlite3-dev libvulkan-dev vulkan-tools mesa-vulkan-drivers \
            vulkan-validationlayers libcurl4-openssl-dev glslang-tools xvfb pkg-config libopenexr-dev \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DVULKAX_REQUIRE_PHYSICS_STUDIO=ON
          -DVULKAX_DIRECT_VULKAN_VALIDATION=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Physics Studio native smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          test -x "build/Vulkax Physics Studio"
          "build/Vulkax Physics Studio" --smoke
          "build/Vulkax Physics Studio" --preset nbody-orbits \
            --export-sequence /tmp/physics-nbody --frames 3
          python3 tests/test_physics_sequence.py /tmp/physics-nbody --requires-variation
          "build/Vulkax Physics Studio" --export-exr /tmp/physics-preview.exr
          python3 tests/test_openexr_export.py /tmp/physics-preview.exr
      - name: Validate gateway runtime entrypoint
        run: |
          python3 -m py_compile services/atlas_gateway/server.py
          python3 services/atlas_gateway/server.py \
            --listen 127.0.0.1 --port 18080 \
            --replay data/atlas/navigation_replay.json &
          GATEWAY_PID=$!
          trap 'kill "$GATEWAY_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/v1/status >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          exit 1
      - name: Resolve Lavapipe driver
        run: |
          LVP_ICD="$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d \
            -type f -name 'lvp_icd*.json' -print -quit 2>/dev/null)"
          test -n "$LVP_ICD"
          echo "VK_DRIVER_FILES=$LVP_ICD" >> "$GITHUB_ENV"
          echo "Lavapipe manifest: $LVP_ICD"
      - name: Verify Vulkan software device
        run: vulkaninfo --summary
      - name: Direct Physics Studio Vulkan validation
        run: |
          set -o pipefail
          : > /tmp/vulkax-direct-validation.log
          for mode in wave black-hole kerr volume; do
            case "$mode" in
              wave) args="" ;;
              black-hole) args="--black-hole" ;;
              kerr) args="--kerr --spin 0.72" ;;
              volume) args="--volume" ;;
            esac
            echo "=== direct Vulkan $mode ===" | tee -a /tmp/vulkax-direct-validation.log
            xvfb-run -a build/vulkax-physics-vulkan-direct --smoke --frames 2 $args \
              2>&1 | tee -a /tmp/vulkax-direct-validation.log
          done
          if grep -E 'Validation Error|VUID-' /tmp/vulkax-direct-validation.log; then
            echo "Vulkan validation errors were reported by the direct Physics Studio path" >&2
            exit 1
          fi
      - name: Relocated runtime resource smoke
        run: |
          test -f build/resources/shaders/vulkax_wave_field.comp.spv
          rm -rf /tmp/vulkax-relocated
          mkdir -p /tmp/vulkax-relocated
          cp build/vulkax-compute /tmp/vulkax-relocated/
          cp -R build/resources /tmp/vulkax-relocated/resources
          (cd /tmp && /tmp/vulkax-relocated/vulkax-compute \
            --width 16 --height 9 --output /tmp/vulkax-relocated-wave)
      - name: Vulkan software smoke test
        run: |
          xvfb-run -a build/LveEngine --geo --geo-policy fixed-lod1 \
            --lights 10 --width 320 --height 180 --warmup-frames 30 --frames 1 \
            --capture-reference true --output /tmp/geobeacon-ci --quiet
          python3 tests/verify_geobeacon_capture.py /tmp/geobeacon-ci
      - name: Vulkax Atlas globe smoke test
        run: |
          xvfb-run -a build/VulkaxAtlas \
            --width 320 --height 180 --warmup-frames 1 --frames 1 \
            --output /tmp/atlas-ci --quiet
      - name: Upload smoke measurements
        uses: actions/upload-artifact@v7
        with:
          name: vulkax-lavapipe-smoke
          path: |
            /tmp/geobeacon-ci
            /tmp/atlas-ci
            /tmp/vulkax-direct-validation.log

  macos-native-metal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build native Physics Studio
        working-directory: apps/VulkaxPhysicsStudioMac
        run: swift build -c release
      - name: Native Metal scalar smoke
        working-directory: apps/VulkaxPhysicsStudioMac
        run: .build/release/VulkaxPhysicsStudioMac --native-gpu-smoke
      - name: Native Metal black-hole smoke
        working-directory: apps/VulkaxPhysicsStudioMac
        run: .build/release/VulkaxPhysicsStudioMac --native-black-hole-gpu-smoke
      - name: Native Metal volume smoke
        working-directory: apps/VulkaxPhysicsStudioMac
        run: .build/release/VulkaxPhysicsStudioMac --native-volume-gpu-smoke
      - name: Native Metal imported-mesh smoke
        working-directory: apps/VulkaxPhysicsStudioMac
        run: >-
          .build/release/VulkaxPhysicsStudioMac
          --native-imported-mesh-gpu-smoke
          ../../tests/fixtures/airflow_cube.obj
      - name: Native visual scene mesh smoke
        working-directory: apps/VulkaxPhysicsStudioMac
        run: >-
          .build/release/VulkaxPhysicsStudioMac
          --native-scene-mesh-gpu-smoke
          ../../tests/fixtures/airflow_cube.obj
      - name: Native 4K cinematic capture smoke
        working-directory: apps/VulkaxPhysicsStudioMac
        run: .build/release/VulkaxPhysicsStudioMac --native-cinematic-capture-smoke
      - name: Native dynamic equation project smoke
        working-directory: apps/VulkaxPhysicsStudioMac
        run: .build/release/VulkaxPhysicsStudioMac --native-dynamic-equation-project-gpu-smoke

  windows-ucrt64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-glm
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-openexr
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
      - name: Configure Windows product
        run: >-
          cmake -S . -B build-windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DVULKAX_REQUIRE_PHYSICS_STUDIO=ON
      - name: Build Windows product and tests
        run: cmake --build build-windows
      - name: Run portable numerical and contract tests
        run: >-
          ctest --test-dir build-windows --output-on-failure
          -R '^(beacon_core|equation_core|equation_glsl|physics_ir|medium_inference|runtime_contract|simulation_graph|particle_gravity|buoyant_smoke|fluid_rigid_coupling|sparse_brick_storage|schwarzschild_lensing|kerr_geodesic|schwarzschild_thin_disk|quality_controller|atlas_core)$'
      - name: Run Qt offscreen Studio smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: './build-windows/Vulkax\ Physics\ Studio.exe --smoke'
