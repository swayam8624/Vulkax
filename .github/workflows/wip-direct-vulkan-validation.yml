name: WIP direct Vulkan validation coverage

on:
  push:
    branches:
      - fix/direct-vulkan-validation-ci

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/direct-vulkan-validation-ci
      - name: Patch modern validation lane
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/analysis.yml')
          text=path.read_text()
          text=text.replace(
              'run: cmake --build build-validation --target LveEngine',
              'run: cmake --build build-validation --target LveEngine VulkaxPhysicsVulkanDirect',1)
          marker='''          if grep -E 'Validation Error|VUID-[A-Za-z0-9_-]+' /tmp/vulkax-validation.stderr; then
            echo 'Vulkan validation diagnostics detected' >&2
            exit 1
          fi
'''
          addition=marker+'''      - name: Run direct Physics Studio validation smokes
        run: |
          set -o pipefail
          : > /tmp/vulkax-direct-validation.stderr
          xvfb-run -a build-validation/vulkax-physics-vulkan-direct --smoke \
            2> >(tee -a /tmp/vulkax-direct-validation.stderr >&2)
          xvfb-run -a build-validation/vulkax-physics-vulkan-direct --black-hole --smoke \
            2> >(tee -a /tmp/vulkax-direct-validation.stderr >&2)
          xvfb-run -a build-validation/vulkax-physics-vulkan-direct --volume --smoke \
            2> >(tee -a /tmp/vulkax-direct-validation.stderr >&2)
          if grep -E 'Validation Error|VUID-[A-Za-z0-9_-]+' /tmp/vulkax-direct-validation.stderr; then
            echo 'Direct Physics Studio Vulkan validation diagnostics detected' >&2
            exit 1
          fi
'''
          if 'Run direct Physics Studio validation smokes' not in text:
              if marker not in text: raise SystemExit('validation lane marker missing')
              text=text.replace(marker,addition,1)
          path.write_text(text)
          PY
      - name: Install validation runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libglfw3-dev libglm-dev nlohmann-json3-dev \
            libsqlite3-dev libvulkan-dev vulkan-tools mesa-vulkan-drivers vulkan-validationlayers \
            libcurl4-openssl-dev glslang-tools xvfb pkg-config libopenexr-dev
      - name: Configure direct validation build
        run: >-
          cmake -S . -B build-check -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=OFF
          -DVULKAX_BUILD_PHYSICS_STUDIO=OFF
      - name: Build direct presenter
        run: cmake --build build-check --target VulkaxPhysicsVulkanDirect
      - name: Resolve Lavapipe
        run: |
          LVP_ICD="$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -type f -name 'lvp_icd*.json' -print -quit 2>/dev/null)"
          test -n "$LVP_ICD"
          echo "VK_DRIVER_FILES=$LVP_ICD" >> "$GITHUB_ENV"
      - name: Run direct validation smoke now
        run: |
          xvfb-run -a build-check/vulkax-physics-vulkan-direct --smoke
          xvfb-run -a build-check/vulkax-physics-vulkan-direct --black-hole --smoke
          xvfb-run -a build-check/vulkax-physics-vulkan-direct --volume --smoke
      - name: Commit permanent analysis coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/analysis.yml
          git diff --cached --check
          git commit -m "Validate direct Vulkan Physics Studio paths"
          git push origin HEAD:fix/direct-vulkan-validation-ci
