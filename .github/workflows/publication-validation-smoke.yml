name: Publication validation smoke

on:
  pull_request:
    paths:
      - "research/validation/**"
      - "research/analysis/*publication_validation.py"
      - "research/analysis/plan_validation_sample_size.py"
      - "research/analysis/analyze_transaction_utility.py"
      - "research/scripts/run_publication_validation.sh"
      - "research/scripts/prepare_public_validation_data.sh"
      - "research/scripts/fetch_public_validation_datasets.py"
      - "research/analysis/prepare_public_validation_datasets.py"
      - "research/analysis/adapt_public_validation_inputs.py"
      - "research/analysis/run_gauge_prospective_validation.py"
      - "research/analysis/analyze_gauge_validation_failure.py"
      - "research/analysis/run_iris_pendulum_validation.py"
      - "research/analysis/analyze_iris_pendulum_validation.py"
      - "research/analysis/analyze_iris_clustered_statistics.py"
      - "research/analysis/analyze_iris_strong_baselines.py"
      - "research/analysis/run_iris_gt_hidden_proposal_gate.py"
      - "research/analysis/run_iris_postfinal_robustness.py"
      - "research/analysis/run_iris_channel_dependence.py"
      - "research/analysis/analyze_iris_truth_uncertainty.py"
      - "research/analysis/run_iris_freefall_validation.py"
      - "research/analysis/freeze_iris_freefall_final_test.py"
      - "research/scripts/fetch_iris_freefall_blind.py"
      - "research/scripts/fetch_iris_freefall_rescue_v6.py"
      - "research/scripts/fetch_iris_reference_baselines.py"
      - "research/scripts/run_postfinal_reviewer_hardening.sh"
      - "research/scripts/build_iris_metal_preprocessor.sh"
      - "research/scripts/manage_public_data_storage.sh"
      - "src/tools/iris_metal_preprocess.mm"
      - "research/scripts/run_iris_freefall_blind_validation.sh"
      - "research/scripts/run_iris_freefall_rescue_v6.sh"
      - "research/scripts/run_iris_freefall_final_test.sh"
      - "research/scripts/run_iris_freefall_v6_final_test.sh"
      - "research/scripts/fetch_iris_freefall_v6_final.py"
      - "research/analysis/freeze_iris_freefall_v6_final.py"
      - "visualization/scripts/render_reviewer_hardening.py"
      - "visualization/scripts/render_gt_hidden_rewrite_demo.py"
      - "research/reviewer_redteam/**"
      - "research/scripts/run_iris_pendulum_final_test.sh"
      - "research/analysis/summarize_iris_pendulum_final_test.py"
      - "research/analysis/freeze_iris_pendulum_final_test.py"
      - "research/scripts/fetch_iris_pendulum_repeats.py"
      - "research/scripts/run_iris_pendulum_validation.sh"
      - "research/scripts/run_gauge_prospective_validation.sh"
      - "research/analysis/assemble_paper_evidence.py"
      - "run_everything.sh"
      - "research/paper_data/**"
      - "research/results/IRIS_PENDULUM_FINAL_TEST_RESULT_2026-09-23.json"
      - "research/status/**"
      - "research/literature/CLAIM_GUARD.md"
      - "docs/PUBLICATION_VALIDATION.md"
      - ".github/workflows/publication-validation-smoke.yml"
  push:
    branches: ["main"]
    paths:
      - "research/validation/**"
      - "research/analysis/*publication_validation.py"
      - "research/analysis/plan_validation_sample_size.py"
      - "research/analysis/analyze_transaction_utility.py"
      - "research/scripts/run_publication_validation.sh"
      - "research/scripts/prepare_public_validation_data.sh"
      - "research/scripts/fetch_public_validation_datasets.py"
      - "research/analysis/prepare_public_validation_datasets.py"
      - "research/analysis/adapt_public_validation_inputs.py"
      - "research/analysis/freeze_iris_pendulum_final_test.py"
      - "research/analysis/summarize_iris_pendulum_final_test.py"
      - "research/scripts/run_iris_pendulum_final_test.sh"
      - ".github/workflows/publication-validation-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate protocol JSON
        run: |
          python3 - <<'PY'
          import json
          for path in (
              "research/validation/protocol_v1.json",
              "research/validation/record_schema_v1.json",
              "research/validation/iris_pendulum_final_test_v1.json",
              "research/validation/post_final_hardening_v1.json",
              "research/validation/iris_freefall_blind_v1.json",
              "research/validation/iris_freefall_rescue_v6.json",
              "research/results/IRIS_PENDULUM_FINAL_TEST_RESULT_2026-09-23.json",
          ):
              json.load(open(path))
              print("VALID", path)
          PY

      - name: Compile validation scripts
        run: |
          python3 -m py_compile \
            research/analysis/normalize_publication_validation.py \
            research/analysis/analyze_publication_validation.py \
            research/analysis/generate_controlled_validation_plan.py \
            research/analysis/freeze_publication_validation.py \
            research/analysis/plan_validation_sample_size.py \
            research/analysis/analyze_transaction_utility.py \
            research/analysis/assemble_paper_evidence.py \
            research/analysis/prepare_public_validation_datasets.py \
            research/analysis/adapt_public_validation_inputs.py \
            research/analysis/run_gauge_prospective_validation.py \
            research/analysis/analyze_gauge_validation_failure.py \
            research/analysis/run_iris_pendulum_validation.py \
            research/analysis/analyze_iris_pendulum_validation.py \
            research/analysis/analyze_iris_clustered_statistics.py \
            research/analysis/analyze_iris_strong_baselines.py \
            research/analysis/run_iris_gt_hidden_proposal_gate.py \
            research/analysis/run_iris_postfinal_robustness.py \
            research/analysis/run_iris_channel_dependence.py \
            research/analysis/analyze_iris_truth_uncertainty.py \
            research/analysis/run_iris_freefall_validation.py \
            research/analysis/freeze_iris_freefall_final_test.py \
            research/analysis/freeze_iris_freefall_v6_final.py \
            research/analysis/freeze_iris_pendulum_final_test.py \
            research/analysis/summarize_iris_pendulum_final_test.py \
            research/scripts/fetch_iris_pendulum_repeats.py \
            research/scripts/fetch_iris_freefall_blind.py \
            research/scripts/fetch_iris_freefall_rescue_v6.py \
            research/scripts/fetch_iris_reference_baselines.py \
            visualization/scripts/render_reviewer_hardening.py \
            visualization/scripts/render_gt_hidden_rewrite_demo.py \
            research/scripts/fetch_public_validation_datasets.py

      - name: Install hardening test dependencies
        run: |
          python3 -m pip install --quiet "numpy>=1.26,<3"

      - name: Script self-tests
        run: |
          python3 research/analysis/normalize_publication_validation.py --self-test
          python3 research/analysis/analyze_publication_validation.py --self-test
          python3 research/analysis/generate_controlled_validation_plan.py --self-test
          python3 research/analysis/freeze_publication_validation.py --self-test
          python3 research/analysis/plan_validation_sample_size.py --out /tmp/sample-size.json
          python3 research/analysis/assemble_paper_evidence.py --self-test
          python3 research/scripts/fetch_public_validation_datasets.py --self-test
          python3 research/analysis/prepare_public_validation_datasets.py --self-test
          # V6 manifest -> public-data adapter contract regression
          rm -rf /tmp/v6-contract
          mkdir -p /tmp/v6-contract/root/iris/Dropping_ball/drop_50
          mkdir -p /tmp/v6-contract/root/gauge /tmp/v6-contract/root/rgbench
          printf 'x' > /tmp/v6-contract/root/iris/Dropping_ball/drop_50/06.mp4
          cat > /tmp/v6-contract/root/iris/parameters.json <<'JSON'
          {"dropping_ball":{"drop_50":{"drop_height":{"mean":0.5}}}}
          JSON
          cat > /tmp/v6-contract/root/iris/vulkax_download_manifest.json <<'JSON'
          {"schema":"vulkax.public_dataset_download","version":2,"dataset":"iris","repo_id":"rasulkhanbayov/IRIS","revision":"c253822f55431ca80ef2084de4bc5e79d1a488f1","license":"CC-BY-NC-4.0","citation_url":"https://huggingface.co/datasets/rasulkhanbayov/IRIS","profile":"freefall_rescue_v6_development","requested_patterns":[],"file_count":2,"total_bytes":1,"files":[]}
          JSON
          cat > /tmp/v6-contract/root/gauge/vulkax_download_manifest.json <<'JSON'
          {"schema":"vulkax.public_dataset_download","version":1,"dataset":"gauge","repo_id":"InternRobotics/GAUGE-Dataset","revision":"test","license":"MIT","citation_url":"https://huggingface.co/datasets/InternRobotics/GAUGE-Dataset","profile":"fixture","requested_patterns":[],"file_count":0,"total_bytes":0,"files":[]}
          JSON
          cat > /tmp/v6-contract/root/rgbench/vulkax_download_manifest.json <<'JSON'
          {"schema":"vulkax.public_dataset_download","version":1,"dataset":"rgbench","repo_id":"RGBench/RGBench-Cloth-Sim2Real-v1","revision":"test","license":"CC-BY-4.0","citation_url":"https://huggingface.co/datasets/RGBench/RGBench-Cloth-Sim2Real-v1","profile":"fixture","requested_patterns":[],"file_count":0,"total_bytes":0,"files":[]}
          JSON
          python3 research/analysis/prepare_public_validation_datasets.py --root /tmp/v6-contract/root --out /tmp/v6-contract/out
          python3 - <<'PY'
          import csv
          rows=list(csv.DictReader(open("/tmp/v6-contract/out/dataset_inventory.csv")))
          iris=[r for r in rows if r["dataset"]=="iris"]
          assert len(iris)==1, iris
          assert iris[0]["source_uri"]=="https://huggingface.co/datasets/rasulkhanbayov/IRIS", iris[0]
          print("VALID V6 manifest/public-data adapter contract")
          PY
          python3 research/analysis/adapt_public_validation_inputs.py --self-test
          python3 research/analysis/analyze_gauge_validation_failure.py --self-test
          python3 research/analysis/run_iris_pendulum_validation.py --self-test
          python3 research/analysis/analyze_iris_pendulum_validation.py --self-test
          python3 research/analysis/analyze_iris_clustered_statistics.py --self-test
          python3 research/analysis/analyze_iris_strong_baselines.py --self-test
          python3 research/analysis/run_iris_gt_hidden_proposal_gate.py --self-test
          python3 research/analysis/run_iris_postfinal_robustness.py --self-test
          python3 research/analysis/run_iris_channel_dependence.py --self-test
          python3 research/analysis/analyze_iris_truth_uncertainty.py --self-test
          python3 research/analysis/run_iris_freefall_validation.py --self-test
          python3 research/analysis/freeze_iris_freefall_final_test.py --self-test
          python3 research/analysis/freeze_iris_freefall_v6_final.py --self-test
          python3 research/scripts/fetch_iris_freefall_blind.py --self-test
          python3 research/scripts/fetch_iris_freefall_rescue_v6.py --config research/validation/iris_freefall_rescue_v6.json --phase development --self-test
          python3 research/scripts/fetch_iris_freefall_rescue_v6.py --config research/validation/iris_freefall_rescue_v6.json --phase validation --self-test
          python3 research/scripts/fetch_iris_freefall_v6_final.py --config research/validation/iris_freefall_rescue_v6.json --lock /tmp/placeholder --self-test
          python3 research/scripts/fetch_iris_reference_baselines.py --self-test
          python3 research/analysis/freeze_iris_pendulum_final_test.py --self-test
          python3 research/analysis/summarize_iris_pendulum_final_test.py --self-test
          python3 research/scripts/fetch_iris_pendulum_repeats.py --self-test

      - name: Free-fall static analysis
        run: |
          python3 -m pip install --quiet "pyflakes>=3.2,<4"
          python3 -m pyflakes research/analysis/run_iris_freefall_validation.py

      - name: Shell syntax
        run: |
          bash -n run_everything.sh
          bash -n research/scripts/run_publication_validation.sh
          bash -n research/scripts/prepare_public_validation_data.sh
          bash -n research/scripts/run_gauge_prospective_validation.sh
          bash -n research/scripts/run_iris_pendulum_validation.sh
          bash -n research/scripts/run_iris_pendulum_final_test.sh
          bash -n research/scripts/run_postfinal_reviewer_hardening.sh
          bash -n research/scripts/build_iris_metal_preprocessor.sh
          bash -n research/scripts/manage_public_data_storage.sh
          bash -n research/scripts/run_iris_freefall_blind_validation.sh
          bash -n research/scripts/run_iris_freefall_rescue_v6.sh
          bash -n research/scripts/run_iris_freefall_final_test.sh
          bash -n research/scripts/run_iris_freefall_rescue_v6.sh
          bash -n research/scripts/run_iris_freefall_v6_final_test.sh

      - name: Free-fall rescue runner preflight contract
        run: |
          rm -rf /tmp/v6-runner-preflight
          bash research/scripts/run_iris_freefall_rescue_v6.sh \
            --build-dir /tmp/v6-runner-preflight \
            --preflight-only

      - name: Live public dataset catalog check
        run: |
          python3 -m pip install --quiet "huggingface_hub>=0.34,<2"
          python3 research/scripts/fetch_public_validation_datasets.py \
            --profile core \
            --catalog-only

      - name: IRIS synthetic-video tracker regression
        run: |
          python3 -m pip install --quiet "numpy>=1.26,<3" "opencv-python-headless>=4.10,<5" "pyflakes>=3.2,<4"
          python3 research/analysis/run_iris_pendulum_validation.py --self-test-video
          python3 research/analysis/run_iris_freefall_validation.py --self-test-video


      - name: IRIS V6.5 one-take live development probe
        if: github.event_name == 'pull_request'
        run: |
          python3 -m pip install --quiet "huggingface_hub>=0.34,<2" "numpy>=1.26,<3" "opencv-python-headless>=4.10,<5"
          rm -rf /tmp/iris-v65-one
          mkdir -p /tmp/iris-v65-one
          python3 - <<'PY'
          import json
          src="research/validation/iris_freefall_rescue_v6.json"
          dst="/tmp/iris-v65-one/config.json"
          cfg=json.load(open(src))
          cfg["dataset"]["development"]["takes"]=["07"]
          cfg["development_gate"]["minimum_quality_videos"]=1
          json.dump(cfg,open(dst,"w"),indent=2)
          PY
          python3 research/scripts/fetch_iris_freefall_rescue_v6.py \
            --data-root /tmp/iris-v65-one/public-datasets \
            --config /tmp/iris-v65-one/config.json \
            --phase development
          # The standardized preparation layer expects all catalog families to
          # have provenance manifests even when this diagnostic intentionally
          # downloads only one IRIS video.  Provide empty provenance-only
          # fixtures for the unrelated families; no GAUGE/RGBench samples enter
          # the IRIS analysis.
          mkdir -p /tmp/iris-v65-one/public-datasets/gauge /tmp/iris-v65-one/public-datasets/rgbench
          cat > /tmp/iris-v65-one/public-datasets/gauge/vulkax_download_manifest.json <<'JSON'
          {"schema":"vulkax.public_dataset_download","version":1,"dataset":"gauge","repo_id":"InternRobotics/GAUGE-Dataset","revision":"diagnostic-fixture","license":"MIT","citation_url":"https://huggingface.co/datasets/InternRobotics/GAUGE-Dataset","profile":"iris_one_take_diagnostic","requested_patterns":[],"file_count":0,"total_bytes":0,"files":[]}
          JSON
          cat > /tmp/iris-v65-one/public-datasets/rgbench/vulkax_download_manifest.json <<'JSON'
          {"schema":"vulkax.public_dataset_download","version":1,"dataset":"rgbench","repo_id":"RGBench/RGBench-Cloth-Sim2Real-v1","revision":"diagnostic-fixture","license":"CC-BY-4.0","citation_url":"https://huggingface.co/datasets/RGBench/RGBench-Cloth-Sim2Real-v1","profile":"iris_one_take_diagnostic","requested_patterns":[],"file_count":0,"total_bytes":0,"files":[]}
          JSON
          python3 research/analysis/prepare_public_validation_datasets.py \
            --root /tmp/iris-v65-one/public-datasets \
            --out /tmp/iris-v65-one/public-data
          python3 research/analysis/adapt_public_validation_inputs.py \
            --repo-root . \
            --data-root /tmp/iris-v65-one/public-datasets \
            --prepared-root /tmp/iris-v65-one/public-data
          set +e
          python3 research/analysis/run_iris_freefall_validation.py \
            --adapted-root /tmp/iris-v65-one/public-data/adapted \
            --config /tmp/iris-v65-one/config.json \
            --split development \
            --out /tmp/iris-v65-one/result
          rc=$?
          set -e
          echo "analyzer_rc=$rc"
          cat /tmp/iris-v65-one/result/summary.json
          python3 - <<'PY'
          import csv
          p="/tmp/iris-v65-one/result/candidate_audit.csv"
          rows=list(csv.DictReader(open(p)))
          for r in rows[:12]:
              print(
                  "AUDIT",
                  "rank="+r["event_rank"],
                  "selected="+r["selected"],
                  "track="+r["track_id"],
                  "pspan="+r["global_progress_span"],
                  "T="+r["full_fall_time_s"],
                  "norm_a="+r["normalized_acceleration_s2"],
                  "a_stab="+r["acceleration_stability"],
                  "release="+r["release_speed_ratio"],
                  "roots="+r["roots_complete"],
                  "shape="+r["trajectory_shape_rms_fraction"],
                  "timing="+r["timing_fit_rms_frames"],
                  "g="+r["direct_acceleration_m_s2"],
                  "gerr="+r["acceleration_relative_error"],
              )
          PY

      - name: Package IRIS one-take visual diagnostics
        if: always()
        run: |
          if [ -f /tmp/iris-v65-one/public-datasets/iris/Dropping_ball/drop_50/07.mp4 ]; then
            mkdir -p /tmp/iris-v65-one/debug
            python3 - <<'PY'
            import cv2, pathlib, numpy as np, shutil
            root=pathlib.Path("/tmp/iris-v65-one")
            video=root/"public-datasets/iris/Dropping_ball/drop_50/07.mp4"
            out=root/"debug"
            cap=cv2.VideoCapture(str(video))
            fps=float(cap.get(cv2.CAP_PROP_FPS))
            n=int(cap.get(cv2.CAP_PROP_FRAME_COUNT))
            def read_frame(idx):
                cap.set(cv2.CAP_PROP_POS_FRAMES,int(idx))
                ok,fr=cap.read()
                if not ok:
                    return None
                h,w=fr.shape[:2]
                scale=320.0/w
                fr=cv2.resize(fr,(320,int(round(h*scale))),interpolation=cv2.INTER_AREA)
                cv2.putText(fr,f"f={idx} t={idx/fps:.3f}s",(8,22),
                            cv2.FONT_HERSHEY_SIMPLEX,.55,(0,255,0),1,cv2.LINE_AA)
                return fr
            def sheet(indices,name,cols=5):
                ims=[read_frame(i) for i in indices]
                ims=[x for x in ims if x is not None]
                if not ims: return
                h=max(x.shape[0] for x in ims); ww=max(x.shape[1] for x in ims)
                rows=(len(ims)+cols-1)//cols
                canvas=np.zeros((rows*h,cols*ww,3),np.uint8)
                for k,im in enumerate(ims):
                    r,c=divmod(k,cols);canvas[r*h:r*h+im.shape[0],c*ww:c*ww+im.shape[1]]=im
                cv2.imwrite(str(out/name),canvas)
            # Overview of the complete analyzed five-second prefix.
            maxf=min(n-1,int(round(fps*5.0))-1)
            sheet(np.linspace(0,maxf,25,dtype=int),"overview_0_5s.jpg",5)
            # Dense view around the first 1.5 seconds, where the selected event lives.
            sheet(range(0,min(n,int(round(fps*1.5))),3),"dense_0_1p5s.jpg",6)
            cap.release()
            for name in ("summary.json","candidate_audit.csv","take_summary.csv","failure_details.json"):
                src=root/"result"/name
                if src.exists(): shutil.copy2(src,out/name)
            print("DEBUG_DIR",out)
            PY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-v65-one-debug
          path: /tmp/iris-v65-one/debug
          if-no-files-found: ignore
          retention-days: 2

      - name: End-to-end standardized analysis fixture
        run: |
          mkdir -p /tmp/pv
          cat > /tmp/pv/records.csv <<'CSV'
          record_version,trial_id,paired_key,dataset,scene,split,evidence_class,confirmatory,trial_family,ground_truth,method,score,decision,decision_threshold,confidence,physical_delta,target_error_delta,measurement_noise_sigma,pose_noise_sigma,missing_fraction,channel_dependence,negative_control,seed,source_artifact,notes
          1,a1,p1,toy,s1,development,test,false,truth_control,support,m,2.4,support,2,,0.1,-0.2,,,,,false,0,fixture,
          1,a2,p2,toy,s2,development,test,false,truth_control,veto,m,-2.4,veto,2,,-0.1,0.2,,,,,false,0,fixture,
          1,a3,p3,toy,s3,development,test,false,placebo,unresolved,m,0.2,unresolved,2,,0.0,0.0,,,,,true,0,fixture,
          CSV
          python3 research/analysis/normalize_publication_validation.py \
            --extra /tmp/pv/records.csv --out /tmp/pv/normalized.csv
          python3 research/analysis/analyze_publication_validation.py \
            --records /tmp/pv/normalized.csv --bootstrap-reps 100 --out /tmp/pv/analysis
          python3 research/analysis/analyze_transaction_utility.py \
            --records /tmp/pv/normalized.csv --out /tmp/pv/analysis/transaction_utility.csv
          test -s /tmp/pv/analysis/summary.json
          test -s /tmp/pv/analysis/method_summary.csv

      - name: No-extra runner path
        run: |
          rm -rf /tmp/pvbuild
          mkdir -p /tmp/pvbuild/dcs-d4v-discovery /tmp/pvbuild/orthogonal-force-compliance
          cat > /tmp/pvbuild/dcs-d4v-discovery/proposals.csv <<'CSV'
          truth_id,baseline,repair,baseline_target_m,repair_target_m,label,dcs_progress_z,dcs_decision,raw_bundle_progress_z,raw_bundle_decision,raw_point_progress_z,raw_point_decision,fisher_progress_z,fisher_decision,maxmotion_progress_z,maxmotion_decision
          1,a,b,0.1,0.2,deceptive,-0.5,unresolved,-0.4,unresolved,-0.3,unresolved,-0.2,unresolved,-0.1,unresolved
          CSV
          cat > /tmp/pvbuild/orthogonal-force-compliance/proposals.csv <<'CSV'
          truth_id,baseline,repair,baseline_target_m,repair_target_m,label,dcs_progress_z,dcs_decision,raw_bundle_progress_z,raw_bundle_decision,raw_point_progress_z,raw_point_decision,fisher_progress_z,fisher_decision,maxmotion_progress_z,maxmotion_decision,force_progress_z,force_decision
          1,a,b,0.2,0.1,beneficial,0.5,unresolved,0.4,unresolved,0.3,unresolved,0.2,unresolved,0.1,unresolved,0.7,unresolved
          CSV
          bash research/scripts/run_publication_validation.sh \
            --build-dir /tmp/pvbuild \
            --out /tmp/pv-runner \
            --skip-probes \
            --bootstrap-reps 20 \
            --diagnostic
          test -s /tmp/pv-runner/records.csv
          test -s /tmp/pv-runner/analysis/summary.json
