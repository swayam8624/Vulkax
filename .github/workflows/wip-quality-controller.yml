name: WIP equation-aware quality controller

on:
  push:
    branches:
      - work/equation-aware-quality-controller

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/equation-aware-quality-controller
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libglfw3-dev libglm-dev \
            nlohmann-json3-dev libsqlite3-dev libvulkan-dev libcurl4-openssl-dev \
            glslang-tools pkg-config libopenexr-dev
      - name: Apply benchmark comparison patch
        run: python3 scripts/quality_policy_benchmark_patch.py
      - name: Configure
        run: >-
          cmake -S . -B build-quality -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DVULKAX_BUILD_PHYSICS_STUDIO=OFF
      - name: Build controller and benchmark
        run: cmake --build build-quality --target QualityControllerTests VulkaxQualityBenchmark
      - name: Test controller policies
        run: ctest --test-dir build-quality -R '^quality_controller$' --output-on-failure
      - name: Run four-policy benchmark
        run: build-quality/vulkax-quality-benchmark --frames 24 --width 96 --height 54 --target-ms 1.5 --output /tmp/vulkax-quality-policy
      - name: Verify benchmark schema
        run: |
          grep -q 'equation_aware' /tmp/vulkax-quality-policy/quality_summary.json
          grep -q 'numerical_only' /tmp/vulkax-quality-policy/quality_summary.json
          grep -q 'screen_space_only' /tmp/vulkax-quality-policy/quality_summary.json
          grep -q 'cpu_analytical_preview_policy_comparison' /tmp/vulkax-quality-policy/quality_summary.json
      - name: Commit validated controller and benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git diff --cached --check
          git commit -m "Make quality control equation-aware and measurement-explicit"
          git push origin HEAD:work/equation-aware-quality-controller
