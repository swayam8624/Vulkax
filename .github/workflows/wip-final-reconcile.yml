name: WIP Final Vulkax Reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wip-final-reconcile.yml'

permissions:
  contents: write

concurrency:
  group: vulkax-final-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Let prior one-shot jobs settle
        run: sleep 60
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh exact current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply all still-pending migrations
        run: |
          set -euo pipefail
          for script in \
            scripts/apply_problem_runner_migration.py \
            scripts/apply_verticals_phase.py \
            scripts/apply_gpu_dem_phase.py \
            scripts/apply_opengl_phase.py \
            scripts/apply_research_phase.py \
            scripts/apply_verification_docs_phase.py; do
            if [ -f "$script" ]; then
              echo "=== APPLY $script ==="
              python "$script"
            fi
          done
      - name: Remove one-shot migration files
        run: |
          rm -f scripts/apply_problem_runner_migration.py scripts/apply_verticals_phase.py scripts/apply_gpu_dem_phase.py scripts/apply_opengl_phase.py scripts/apply_research_phase.py scripts/apply_verification_docs_phase.py
          rm -f .github/workflows/wip-problem-runner-migration.yml .github/workflows/wip-verticals-phase.yml .github/workflows/wip-gpu-dem-phase.yml .github/workflows/wip-opengl-phase.yml .github/workflows/wip-research-phase.yml .github/workflows/wip-verification-docs-phase.yml .github/workflows/wip-reconcile-phases.yml .github/workflows/wip-reconcile-research-stack.yml
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers glslang-tools libgl1-mesa-dev libegl1-mesa-dev
      - name: Configure integrated tree
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build-final -DCMAKE_BUILD_TYPE=Release -DVULKAX_BUILD_TESTS=ON 2>&1 | tee configure.log
      - name: Build integrated tree
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-final --parallel 2 2>&1 | tee build.log
      - name: Test integrated tree
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-final --output-on-failure 2>&1 | tee test.log
      - name: Native runtime gates
        shell: bash
        run: |
          set -o pipefail
          ./build-final/vulkax --require-backend Vulkan 2>&1 | tee runtime.log
          ./build-final/vulkax --conformance Vulkan 2>&1 | tee -a runtime.log
      - name: Connected problem gates
        shell: bash
        run: |
          set -o pipefail
          : > verticals.log
          for problem in rotating_mill rubber_inverse car_aerodynamics; do
            if [ -f "examples/${problem}.vkx" ]; then
              echo "=== ${problem} ===" | tee -a verticals.log
              ./build-final/vulkax validate "examples/${problem}.vkx" 2>&1 | tee -a verticals.log
              ./build-final/vulkax run "examples/${problem}.vkx" --output "build-final/${problem}" --frames 1 --width 100 --height 80 2>&1 | tee -a verticals.log
              test -s "build-final/${problem}/result.json"
            fi
          done
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: final-reconcile-diagnostics
          path: |
            configure.log
            build.log
            test.log
            runtime.log
            verticals.log
          if-no-files-found: ignore
      - name: Remove local validation output and final reconciler
        run: |
          rm -rf build-final configure.log build.log test.log runtime.log verticals.log
          rm -f .github/workflows/wip-final-reconcile.yml
      - name: Commit only the tested integrated tree
        run: |
          git config user.name "Vulkax Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Vulkax research-grade reference stack"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
