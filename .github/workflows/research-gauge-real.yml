name: Vulkax GAUGE measured-data probe

on:
  push:
    branches: ["research/**"]
    paths:
      - "research/adapters/**"
      - "research/analysis/gauge_foam_descriptive.py"
      - "research/analysis/gauge_shearing_contract.py"
      - "research/analysis/gauge_shearing_affine_baseline.py"
      - "research/analysis/gauge_shearing_nonaffine.py"
      - "research/analysis/run_gauge_shearing_forward.py"
      - "research/analysis/gauge_shearing_forward_analysis.py"
      - "research/analysis/gauge_shearing_repeat_forensics.py"
      - "research/analysis/gauge_shearing_timestep_forensics.py"
      - "research/analysis/gauge_shearing_structural_forensics.py"
      - "research/analysis/gauge_shearing_constitutive_matrix.py"
      - "research/analysis/gauge_shearing_mode_diagnostic.py"
      - "research/analysis/gauge_shearing_mode_compare.py"
      - "research/analysis/gauge_fixture_envelope_synthetic_control.py"
      - "research/analysis/gauge_shearing_boundary_attachment.py"
      - "research/analysis/gauge_foam_asset_geometry.py"
      - "research/probes/gauge_shearing_forward_probe.cpp"
      - "CMakeLists.txt"
      - "research/scripts/fetch_gauge_foam_subset.py"
      - ".github/workflows/research-gauge-real.yml"
  workflow_dispatch:

jobs:
  gauge-measured-foam:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public GAUGE foam subset
        run: python3 research/scripts/fetch_gauge_foam_subset.py build/gauge-download
      - name: Exercise Vulkax adapter on each task/material
        run: |
          python3 research/adapters/gauge_deformable_to_vulkax.py --metadata "build/gauge-download/metadata/foam stretching.json" --trial "build/gauge-download/data/foam stretching/soft/1.json" --material soft --out "build/gauge-adapted/stretch-soft"
          python3 research/adapters/gauge_deformable_to_vulkax.py --metadata "build/gauge-download/metadata/foam stretching.json" --trial "build/gauge-download/data/foam stretching/hard/1.json" --material hard --out "build/gauge-adapted/stretch-hard"
          python3 research/adapters/gauge_deformable_to_vulkax.py --metadata "build/gauge-download/metadata/foam compression.json" --trial "build/gauge-download/data/foam compression/soft/1.json" --material soft --out "build/gauge-adapted/compress-soft"
          python3 research/adapters/gauge_deformable_to_vulkax.py --metadata "build/gauge-download/metadata/foam compression.json" --trial "build/gauge-download/data/foam compression/hard/1.json" --material hard --out "build/gauge-adapted/compress-hard"
          python3 research/adapters/gauge_deformable_to_vulkax.py --metadata "build/gauge-download/metadata/foam shearing.json" --trial "build/gauge-download/data/foam shearing/soft/1.json" --material soft --out "build/gauge-adapted/shear-soft"
          python3 research/adapters/gauge_deformable_to_vulkax.py --metadata "build/gauge-download/metadata/foam shearing.json" --trial "build/gauge-download/data/foam shearing/hard/1.json" --material hard --out "build/gauge-adapted/shear-hard"
      - name: Analyze measured repeatability and material signal
        run: |
          python3 research/analysis/gauge_foam_descriptive.py --root build/gauge-download --out build/gauge-real
          cat build/gauge-real/group_summary.csv
          cat build/gauge-real/findings.json
      - name: Freeze GAUGE foam-shearing sim-to-real contract
        run: |
          python3 research/analysis/gauge_shearing_contract.py --root build/gauge-download --out build/gauge-shearing-contract
          cat build/gauge-shearing-contract/contract.json
      - name: Measure whether terminal foam motion supports a hard clamp model
        run: |
          python3 research/analysis/gauge_shearing_boundary_attachment.py --root build/gauge-download --out build/gauge-boundary-attachment
          cat build/gauge-boundary-attachment/summary.json

      - name: Compare released foam geometry against marker-span proxy
        run: |
          python3 research/analysis/gauge_foam_asset_geometry.py --root build/gauge-download --out build/gauge-asset-geometry
          cat build/gauge-asset-geometry/summary.json

      - name: Run zero-parameter affine-shear null baseline
        run: |
          python3 research/analysis/gauge_shearing_affine_baseline.py --root build/gauge-download --out build/gauge-affine-null
          cat build/gauge-affine-null/summary.json
      - name: Quantify non-affine residual across all shearing repeats
        run: |
          python3 research/analysis/gauge_shearing_nonaffine.py --root build/gauge-download --out build/gauge-nonaffine
          cat build/gauge-nonaffine/summary.json
      - name: Configure metadata-only Vulkax forward model
        run: cmake -S . -B build-forward -DCMAKE_BUILD_TYPE=Release -DVULKAX_BUILD_TESTS=OFF
      - name: Build metadata-only Vulkax forward model
        run: cmake --build build-forward --target vulkax_gauge_shearing_forward_probe --parallel 2
      - name: Run no-fit Vulkax GAUGE shearing forward prediction
        run: |
          python3 research/analysis/run_gauge_shearing_forward.py --exe build-forward/vulkax_gauge_shearing_forward_probe --contract-dir build/gauge-shearing-contract --out build/gauge-forward
          cat build/gauge-forward/predicted_soft_summary.json
          cat build/gauge-forward/predicted_hard_summary.json
      - name: Compare Vulkax forward prediction against affine null
        run: |
          python3 research/analysis/gauge_shearing_forward_analysis.py --contract-dir build/gauge-shearing-contract --forward-dir build/gauge-forward --affine-dir build/gauge-affine-null --out build/gauge-forward-analysis
          cat build/gauge-forward-analysis/summary.json

      - name: Replicate no-fit Vulkax forward test across all 20 shearing repeats
        run: |
          python3 research/analysis/gauge_shearing_repeat_forensics.py --root build/gauge-download --exe build-forward/vulkax_gauge_shearing_forward_probe --out build/gauge-repeat-forensics
          cat build/gauge-repeat-forensics/summary.json

      - name: Run released-asset geometry over all 20 shearing repeats
        run: |
          python3 research/analysis/gauge_shearing_repeat_forensics.py --root build/gauge-download --exe build-forward/vulkax_gauge_shearing_forward_probe --geometry-mode released_asset_aspect --out build/gauge-asset-repeat-forensics
          cat build/gauge-asset-repeat-forensics/summary.json

      - name: Test timestep convergence of the frozen no-fit forward miss
        run: |
          python3 research/analysis/gauge_shearing_timestep_forensics.py --exe build-forward/vulkax_gauge_shearing_forward_probe --contract-dir build/gauge-shearing-contract --affine-dir build/gauge-affine-null --out build/gauge-timestep-forensics
          cat build/gauge-timestep-forensics/summary.json

      - name: Run one-factor structural model forensics without material fitting
        run: |
          python3 research/analysis/gauge_shearing_structural_forensics.py --exe build-forward/vulkax_gauge_shearing_forward_probe --contract-dir build/gauge-shearing-contract --affine-dir build/gauge-affine-null --out build/gauge-structural-forensics
          cat build/gauge-structural-forensics/summary.json

      - name: Diagnose deformation modes for baseline and released-asset geometry
        run: |
          python3 research/analysis/gauge_shearing_mode_diagnostic.py --contract-dir build/gauge-shearing-contract --forward-dir build/gauge-structural-forensics/forward_baseline --out build/gauge-mode-baseline
          cat build/gauge-mode-baseline/summary.json
          if [ -d build/gauge-structural-forensics/forward_released_asset_aspect ]; then
            python3 research/analysis/gauge_shearing_mode_diagnostic.py --contract-dir build/gauge-shearing-contract --forward-dir build/gauge-structural-forensics/forward_released_asset_aspect --out build/gauge-mode-released-asset
            cat build/gauge-mode-released-asset/summary.json
          else
            echo "released_asset_aspect forward result unavailable; retaining this as a structural-forensic failure"
          fi

      - name: Compare released-asset geometry against pre-registered mechanism checks
        run: |
          if [ -f build/gauge-mode-released-asset/summary.json ]; then
            python3 research/analysis/gauge_shearing_mode_compare.py \
              --baseline build/gauge-mode-baseline/summary.json \
              --candidate build/gauge-mode-released-asset/summary.json \
              --structural-summary build/gauge-structural-forensics/summary.json \
              --out build/gauge-mode-compare
            cat build/gauge-mode-compare/summary.json
          else
            mkdir -p build/gauge-mode-compare
            printf '%s\n' '{"schema":"vulkax.gauge_fixture_envelope_mode_comparison","version":1,"decision":"candidate_unavailable"}' > build/gauge-mode-compare/summary.json
            cat build/gauge-mode-compare/summary.json
          fi

      - name: Falsify fixture-envelope mechanism in a controlled synthetic world
        run: |
          python3 research/analysis/gauge_fixture_envelope_synthetic_control.py \
            --exe build-forward/vulkax_gauge_shearing_forward_probe \
            --contract-dir build/gauge-shearing-contract \
            --real-mode-summary build/gauge-mode-baseline/summary.json \
            --out build/gauge-fixture-envelope-synthetic
          cat build/gauge-fixture-envelope-synthetic/summary.json

      - name: Run no-fit constitutive x transfer adequacy matrix
        run: |
          python3 research/analysis/gauge_shearing_constitutive_matrix.py --exe build-forward/vulkax_gauge_shearing_forward_probe --contract-dir build/gauge-shearing-contract --affine-dir build/gauge-affine-null --out build/gauge-constitutive-matrix
          cat build/gauge-constitutive-matrix/summary.json

      - name: Upload derived measured-data evidence only
        uses: actions/upload-artifact@v4
        with:
          name: vulkax-gauge-measured-${{ github.sha }}
          path: |
            build/gauge-real
            build/gauge-adapted
            build/gauge-shearing-contract
            build/gauge-boundary-attachment
            build/gauge-asset-geometry
            build/gauge-affine-null
            build/gauge-nonaffine
            build/gauge-forward
            build/gauge-forward-analysis
            build/gauge-repeat-forensics
            build/gauge-asset-repeat-forensics
            build/gauge-timestep-forensics
            build/gauge-structural-forensics
            build/gauge-mode-baseline
            build/gauge-mode-released-asset
            build/gauge-mode-compare
            build/gauge-fixture-envelope-synthetic
            build/gauge-constitutive-matrix
          if-no-files-found: error
          retention-days: 30
