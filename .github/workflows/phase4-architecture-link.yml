name: Phase 4 architecture link

on:
  push:
    branches:
      - agent/phase4-repo-hygiene

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase4-repo-hygiene
      - name: Link architecture map from README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text()
          old = "The complete, honest phase plan is [Vulkax Physics Studio Roadmap](docs/VULKAX_PHYSICS_STUDIO_ROADMAP.md).\n"
          new = old + "The repository ownership map is documented in [Vulkax Architecture](docs/VULKAX_ARCHITECTURE.md).\n"
          if old not in text:
              raise SystemExit("README roadmap sentence not found")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/phase4-architecture-link.yml").unlink()
          PY
      - name: Commit README link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Link repository architecture map"
          git push origin HEAD:agent/phase4-repo-hygiene
