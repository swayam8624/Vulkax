name: Phase 2 build refactor

on:
  push:
    branches:
      - agent/phase2-build-architecture

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase2-build-architecture
          fetch-depth: 0
      - name: Apply deterministic refactor
        run: python3 tools/maintenance/phase2_refactor.py
      - name: Normalize extracted modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("cmake/VulkaxDependencies.cmake", "cmake/VulkaxShaders.cmake"):
              path = Path(name)
              lines = [line.rstrip() for line in path.read_text().splitlines()]
              while lines and not lines[-1]:
                  lines.pop()
              path.write_text("\n".join(lines) + "\n")
          PY
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refactor build architecture"
          git push origin HEAD:agent/phase2-build-architecture
