name: WIP generated transport solver

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libvulkan-dev glslang-tools \
            libglfw3-dev libglm-dev nlohmann-json3-dev libsqlite3-dev libcurl4-openssl-dev \
            pkg-config libopenexr-dev
      - name: Wire generated transport solver
        run: python3 scripts/wire_generated_transport.py
      - name: Configure
        run: >-
          cmake -S . -B build-transport -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DVULKAX_BUILD_PHYSICS_STUDIO=OFF
      - name: Build and test generated transport
        run: |
          cmake --build build-transport --target GeneratedTransportTests PhysicsIrTests
          ctest --test-dir build-transport -R '^(generated_transport|physics_ir)$' --output-on-failure
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vulkax/physics/generated_transport.cpp CMakeLists.txt cmake/VulkaxTests.cmake
          git diff --cached --check
          git commit -m "Integrate generated transport-diffusion solver"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
