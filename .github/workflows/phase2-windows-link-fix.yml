name: Phase 2 Windows link fix

on:
  push:
    branches:
      - agent/phase2-build-architecture

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase2-build-architecture
      - name: Fix Windows imported target usage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("CMakeLists.txt")
          text = path.read_text()
          old = '''  target_link_directories(${PROJECT_NAME} PUBLIC
    Vulkan::Vulkan
    ${GLFW_LIB}
  )

  target_link_libraries(${PROJECT_NAME} glfw3 vulkan-1 nlohmann_json::nlohmann_json)
'''
          new = '''  if (GLFW_LIB)
    target_link_directories(${PROJECT_NAME} PUBLIC ${GLFW_LIB})
  endif()

  target_link_libraries(
    ${PROJECT_NAME} glfw3 Vulkan::Vulkan nlohmann_json::nlohmann_json)
'''
          if old not in text:
              raise SystemExit("expected Windows Vulkan link block not found")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/phase2-windows-link-fix.yml").unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Windows imported Vulkan target linking"
          git push origin HEAD:agent/phase2-build-architecture
