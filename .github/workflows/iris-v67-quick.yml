name: IRIS V6.7 Quick Oracle

on:
  push:
    branches:
      - research/iris-freefall-v67-scale-aware
    paths:
      - .github/workflows/iris-v67-quick.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --quiet             "numpy>=1.26,<3"             "opencv-python-headless>=4.10,<5"             "huggingface_hub>=0.34,<2"
      - name: Fetch spent development
        run: |
          python research/scripts/fetch_iris_freefall_rescue_v6.py             --data-root build/public-datasets             --config research/validation/iris_freefall_rescue_v6.json             --phase development
      - name: Fetch spent validation
        run: |
          python research/scripts/fetch_iris_freefall_rescue_v6.py             --data-root build/public-datasets             --config research/validation/iris_freefall_rescue_v6.json             --phase validation
      - name: Quick oracle/ranker campaign at 640
        run: |
          python research/scripts/run_iris_freefall_v67_research_campaign.py             --data-root build/public-datasets             --widths 640             --out-dir build/v67-quick | tee build/v67-quick.log
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-v67-quick
          path: |
            build/v67-quick/**
            build/v67-quick.log
          if-no-files-found: warn
