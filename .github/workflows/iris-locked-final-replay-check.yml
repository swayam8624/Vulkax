name: IRIS locked final replay check

on:
  push:
    branches:
      - research/iris-freefall-v67-scale-aware
    paths:
      - .github/workflows/iris-locked-final-replay-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv ffmpeg

      - name: Replay frozen validation and final campaign
        run: |
          set -Eeuo pipefail
          LOCK_SHA=9e56f06145b8a56dd26c1c81e064ed9b185c77d7
          git worktree add --detach /tmp/vulkax-iris-lock "$LOCK_SHA"

          mkdir -p "$GITHUB_WORKSPACE/build"
          ln -s "$GITHUB_WORKSPACE/build" /tmp/vulkax-iris-lock/build
          cd /tmp/vulkax-iris-lock

          python3 -m venv "$GITHUB_WORKSPACE/build/.venv-bootstrap"
          "$GITHUB_WORKSPACE/build/.venv-bootstrap/bin/python" -m pip install --quiet \
            "huggingface_hub>=0.34,<2" \
            "numpy>=1.26,<3" \
            "opencv-python-headless>=4.10,<5"

          "$GITHUB_WORKSPACE/build/.venv-bootstrap/bin/python" \
            research/scripts/fetch_public_validation_datasets.py \
            --root "$GITHUB_WORKSPACE/build/public-datasets" \
            --profile smoke \
            --datasets gauge rgbench

          bash research/scripts/run_iris_pendulum_validation.sh \
            --build-dir "$GITHUB_WORKSPACE/build" \
            --venv "$GITHUB_WORKSPACE/build/.venv-iris-pendulum" \
            --phase validation

          bash research/scripts/run_iris_pendulum_final_test.sh \
            --build-dir "$GITHUB_WORKSPACE/build" \
            --venv "$GITHUB_WORKSPACE/build/.venv-iris-pendulum"

      - name: Verify exact locked result
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          locked = json.loads(Path("research/results/IRIS_PENDULUM_FINAL_TEST_RESULT_2026-09-23.json").read_text())
          replay = json.loads(Path("build/publication-validation/iris-pendulum-final-test/final_summary.json").read_text())

          assert replay["take_count"] == locked["dataset"]["takes"]
          assert replay["quality_pass_take_count"] == locked["dataset"]["quality_pass_takes"]
          assert abs(replay["median_period_inferred_length_relative_error"] -
                     locked["physical_recovery"]["median_period_inferred_length_relative_error"]) < 1e-12

          assert replay["primary"]["method"] == locked["primary"]["method"]
          assert replay["primary"]["strict_correct_n"] == locked["primary"]["correct"]
          assert replay["primary"]["n"] == locked["primary"]["total"]
          assert abs(replay["primary"]["strict_accuracy"] - locked["primary"]["strict_accuracy"]) < 1e-12

          assert replay["baseline"]["method"] == locked["baseline"]["method"]
          assert replay["baseline"]["strict_correct_n"] == locked["baseline"]["correct"]
          assert replay["baseline"]["n"] == locked["baseline"]["total"]
          assert abs(replay["baseline"]["strict_accuracy"] - locked["baseline"]["strict_accuracy"]) < 1e-12

          assert replay["paired_primary_only_correct"] == locked["paired"]["primary_only_correct"]
          assert replay["paired_baseline_only_correct"] == locked["paired"]["baseline_only_correct"]
          assert replay["paired_ties"] == locked["paired"]["ties"]

          print("VALID independent Linux replay matches locked IRIS pendulum result")
          print("PRIMARY", replay["primary"]["strict_correct_n"], "/", replay["primary"]["n"])
          print("BASELINE", replay["baseline"]["strict_correct_n"], "/", replay["baseline"]["n"])
          print("TAKES", replay["take_count"], "QUALITY", replay["quality_pass_take_count"])
          PY
