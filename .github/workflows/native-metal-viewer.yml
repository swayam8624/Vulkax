name: Native Metal viewer

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'include/vulkax/viewer/**'
      - 'src/viewer/**'
      - 'tests/viewer_scene_tests.cpp'
      - 'tests/viewer_asset_import_tests.cpp'
      - 'docs/NATIVE_METAL_VIEWER_MVP.md'
      - '.github/workflows/native-metal-viewer.yml'
  workflow_dispatch:

jobs:
  scene-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure reusable viewer tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVULKAX_BUILD_TESTS=ON
      - name: Build reusable viewer scene and asset import tests
        run: cmake --build build --target vulkax_viewer_scene_tests vulkax_viewer_asset_import_tests --parallel 2
      - name: Test reusable viewer layers
        run: ctest --test-dir build -R '^vulkax_viewer_(scene|asset_import)$' --output-on-failure

  metal-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native viewer
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVULKAX_BUILD_TESTS=ON
      - name: Build native Metal viewer and reusable tests
        run: cmake --build build --target vulkax_viewer vulkax_viewer_scene_tests vulkax_viewer_asset_import_tests --parallel 3
      - name: Compile exact embedded Metal shader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('include/vulkax/viewer/metal_shader_source.hpp').read_text()
          begin_marker = 'R"METAL(\n'
          end_marker = ')METAL";'
          begin = source.index(begin_marker) + len(begin_marker)
          end = source.index(end_marker, begin)
          Path('build/vulkax_native_viewer_embedded.metal').write_text(source[begin:end])
          PY
          xcrun -sdk macosx metal -c build/vulkax_native_viewer_embedded.metal -o build/vulkax_native_viewer_embedded.air
      - name: Test reusable viewer layers on macOS
        run: ctest --test-dir build -R '^vulkax_viewer_(scene|asset_import)$' --output-on-failure
      - name: Verify viewer CLI links and advertises OBJ import
        run: |
          ./build/vulkax_viewer --help | tee /tmp/vulkax-viewer-help.txt
          grep -q -- '--obj' /tmp/vulkax-viewer-help.txt
