name: Reality Probe rewrite v3 check

on:
  push:
    branches:
      - manuscript/reality-probe-rewrite-v3-2026-09-24
    paths:
      - paper/main.tex
      - paper/main_humanized.tex
      - paper/references.bib
      - .github/workflows/manuscript-rewrite-v3-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check manuscript invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path("paper/main.tex").read_text()
          b=Path("paper/main_humanized.tex").read_text()
          assert a == b
          required = [
              "Reality Probe: Verifying Physical Edits in Video-Reconstructed Worlds",
              "fit, test, then commit",
              "81.8\\%",
              "36.4\\%",
              "free-fall protocol fails untouched validation",
              "90/110",
              "40/110",
              "111.7\\%",
              "drop\\_150/02..10",
              "UNRESOLVED",
          ]
          for token in required:
              assert token in a, token
          forbidden = [
              "A captured scene can now",
              "preregistered",
              "universal verifier",
              "successful free-fall",
              "220 independent",
              "TODO",
              "TBD",
          ]
          low=a.lower()
          for token in forbidden:
              assert token.lower() not in low, token
          print("VALID manuscript invariants")
          PY

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-extra texlive-science texlive-publishers

      - name: Compile both sources
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error main_humanized.tex

      - name: Validate final logs
        run: |
          cd paper
          for log in main.log main_humanized.log; do
            if grep -E "Undefined control sequence|LaTeX Error|Citation .* undefined|Reference .* undefined" "$log"; then
              echo "fatal manuscript warning in $log" >&2
              exit 1
            fi
            if grep -E "Overfull \\hbox|Overfull \\vbox" "$log"; then
              echo "layout overflow in $log" >&2
              exit 1
            fi
          done
          echo "VALID manuscript compilation and layout"
