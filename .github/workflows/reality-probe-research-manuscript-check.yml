name: Reality Probe research manuscript check

on:
  push:
    branches:
      - research/iris-freefall-v67-scale-aware
    paths:
      - paper/main.tex
      - paper/main_humanized.tex
      - paper/references.bib
      - research/status/REALITY_PROBE_MANUSCRIPT_REVISION_PLAN_2026-09-23.md
      - .github/workflows/reality-probe-research-manuscript-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-extra texlive-science texlive-publishers
      - name: Evidence-language guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("paper/main.tex").read_text()
          required=[
              "90/110",
              "40/110",
              "111.7\\%",
              "drop\\_150",
              "finite-amplitude period probe",
              "SUPPORT",
              "VETO",
              "UNRESOLVED",
          ]
          for token in required:
              assert token in p, token
          assert "successful free-fall" not in p.lower()
          print("VALID manuscript evidence-language guard")
          PY
      - name: Compile both manuscript sources
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error main_humanized.tex
      - name: Check common LaTeX warnings
        run: |
          cd paper
          for log in main.log main_humanized.log; do
            if grep -E "Undefined control sequence|LaTeX Error|Citation .* undefined|Reference .* undefined" "$log"; then
              echo "fatal manuscript warning detected in $log" >&2
              exit 1
            fi
          done
          echo "VALID both manuscript sources compile/audit"
