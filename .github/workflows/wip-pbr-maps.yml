name: WIP glTF PBR maps

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Apply PBR texture-map wiring
        run: python3 scripts/wire_pbr_maps.py
      - name: Build native Studio
        working-directory: apps/VulkaxPhysicsStudioMac
        run: swift build -c release
      - name: Run glTF and capture regressions
        working-directory: apps/VulkaxPhysicsStudioMac
        run: |
          .build/release/VulkaxPhysicsStudioMac --native-scene-mesh-gpu-smoke ../../tests/fixtures/triangle_pbr.gltf
          .build/release/VulkaxPhysicsStudioMac --native-cinematic-capture-smoke
          .build/release/VulkaxPhysicsStudioMac --native-volume-gpu-smoke
      - name: Commit validated product source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/VulkaxPhysicsStudioMac/Sources/VulkaxPhysicsStudioMac/ImportedObstacleMesh.swift \
                  apps/VulkaxPhysicsStudioMac/Sources/VulkaxPhysicsStudioMac/ImportedGltfAsset.swift \
                  apps/VulkaxPhysicsStudioMac/Sources/VulkaxPhysicsStudioMac/StudioSceneMeshRenderer.swift
          git diff --cached --check
          git commit -m "Render glTF normal and metallic-roughness maps"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
