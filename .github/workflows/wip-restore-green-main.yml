name: WIP restore green main

on:
  push:
    branches:
      - fix/restore-green-main

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/restore-green-main
      - name: Restore deterministic cinematic capture request state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/VulkaxPhysicsStudioMac/Sources/VulkaxPhysicsStudioMac/main.swift')
          text = path.read_text()
          marker = '    @Published private(set) var captureRequestRevision: UInt64 = 0\n'
          addition = marker + '    @Published private(set) var pendingCaptureRequest: CinematicCaptureRequest?\n'
          if 'pendingCaptureRequest: CinematicCaptureRequest?' not in text:
              if marker not in text:
                  raise SystemExit('capture request state marker missing')
              text = text.replace(marker, addition, 1)
          old = '''    func requestCinematicCapture() {\n        capturePanelPresented = false\n        captureRequestRevision &+= 1\n        equationStatus = "Cinematic capture requested · \\(captureSettings.resolution.title) · \\(captureSettings.frameRate.title)"\n    }\n'''
          new = '''    func requestCinematicCapture() {\n        capturePanelPresented = false\n        if isCapturing {\n            equationStatus = "A cinematic capture is already in progress"\n            return\n        }\n        let panel = NSSavePanel()\n        panel.allowedContentTypes = [.quickTimeMovie]\n        panel.nameFieldStringValue = projectName.replacingOccurrences(of: " ", with: "-") + "-simulation.mov"\n        guard panel.runModal() == .OK, let url = panel.url else { return }\n        captureRequestRevision &+= 1\n        pendingCaptureRequest = CinematicCaptureRequest(\n            revision: captureRequestRevision,\n            outputURL: url,\n            settings: captureSettings,\n            camera: camera,\n            timelineSeconds: time)\n        equationStatus = "Preparing \\(captureSettings.resolution.title) capture · \\(captureSettings.frameRate.title)"\n    }\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'let panel = NSSavePanel()' not in text or 'pendingCaptureRequest = CinematicCaptureRequest(' not in text:
              raise SystemExit('cinematic capture method marker missing')
          path.write_text(text)
          PY
      - name: Build native Physics Studio
        working-directory: apps/VulkaxPhysicsStudioMac
        run: swift build -c release
      - name: Run native capture and GPU regression smokes
        working-directory: apps/VulkaxPhysicsStudioMac
        run: |
          .build/release/VulkaxPhysicsStudioMac --native-cinematic-capture-smoke
          .build/release/VulkaxPhysicsStudioMac --native-gpu-smoke
          .build/release/VulkaxPhysicsStudioMac --native-volume-gpu-smoke
      - name: Commit validated product source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/VulkaxPhysicsStudioMac/Sources/VulkaxPhysicsStudioMac/main.swift
          git diff --cached --check
          git commit -m "Restore deterministic cinematic capture requests"
          git push origin HEAD:fix/restore-green-main
