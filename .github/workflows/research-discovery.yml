name: Vulkax discovery cheap probes

on:
  push:
    branches: ["research/**"]
  workflow_dispatch:

concurrency:
  group: vulkax-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness-and-cheap-science:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVULKAX_BUILD_TESTS=ON

      - name: Build executable WorldIR regression
        run: cmake --build build --target vulkax_reality_loop_tests --parallel 2

      - name: Run executable WorldIR regression
        run: ctest --test-dir build --output-on-failure -R '^vulkax_reality_loop$'

      - name: Compile identifiability regression at frozen research head
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -UNDEBUG \
            -Iinclude tests/identifiability_tests.cpp \
            src/world/world_ir.cpp src/world/reality_loop.cpp src/numerics/dense.cpp \
            -o build/vulkax_identifiability_tests
          build/vulkax_identifiability_tests

      - name: Compile cheap falsification suite
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -UNDEBUG \
            -Iinclude research/probes/cheap_science_probe.cpp \
            src/world/world_ir.cpp src/world/reality_loop.cpp src/numerics/dense.cpp \
            -o build/vulkax_cheap_science_probe

      - name: Run cheap falsification suite
        run: |
          build/vulkax_cheap_science_probe build/research-cheap-probes
          python3 research/probes/validate_cheap_science.py build/research-cheap-probes
          cat build/research-cheap-probes/cheap_probes.csv

      - name: Build solver-integrated counterfactual probe
        run: cmake --build build --target vulkax_solver_counterfactual_probe --parallel 2

      - name: Run solver-integrated counterfactual and numerical-confounding probes
        run: |
          build/vulkax_solver_counterfactual_probe build/solver-counterfactual
          python3 research/probes/validate_solver_counterfactual.py build/solver-counterfactual
          cat build/solver-counterfactual/solver_counterfactual.csv

      - name: Build solver active-design probe
        run: cmake --build build --target vulkax_solver_active_design_probe --parallel 2

      - name: Run solver active-design probe
        run: |
          build/vulkax_solver_active_design_probe build/solver-design
          python3 research/probes/validate_solver_active_design.py build/solver-design
          cat build/solver-design/solver_design.csv

      - name: Build solver certificate dataset
        run: cmake --build build --target vulkax_solver_certificate_probe --parallel 2

      - name: Generate and analyze solver certificate dataset
        run: |
          build/vulkax_solver_certificate_probe build/solver-certificate
          python3 research/probes/analyze_solver_certificate.py build/solver-certificate
          cat build/solver-certificate/feature_summary.csv

      - name: Build refusal-repair probe
        run: cmake --build build --target vulkax_refusal_repair_probe --parallel 2

      - name: Run refusal-repair probe
        run: |
          build/vulkax_refusal_repair_probe build/refusal-repair
          python3 research/probes/analyze_refusal_repair.py build/refusal-repair
          cat build/refusal-repair/cases.csv

      - name: Build independent refusal-policy validation
        run: cmake --build build --target vulkax_refusal_validation_probe --parallel 2

      - name: Validate locked refusal policy on off-grid truths
        run: |
          build/vulkax_refusal_validation_probe build/refusal-validation
          python3 research/probes/validate_refusal_policy.py build/refusal-repair/cases.csv build/refusal-validation/cases.csv build/refusal-validation

      - name: Build independent refusal-policy Validation-2
        run: cmake --build build --target vulkax_refusal_validation2_probe --parallel 2

      - name: Validate locked refusal policy on fresh domain shift
        run: |
          build/vulkax_refusal_validation2_probe build/refusal-validation2
          python3 research/probes/validate_refusal_policy_v2.py build/refusal-repair/cases.csv build/refusal-validation2/cases.csv build/refusal-validation2
          cat build/refusal-validation2/policy_validation2.json

      - name: Build adaptive numerical-repair Validation-3
        run: cmake --build build --target vulkax_refusal_validation3_probe --parallel 2

      - name: Run fresh Validation-3 with adaptive computational evidence repair
        run: |
          build/vulkax_refusal_validation3_probe build/refusal-validation3
          python3 research/probes/validate_refusal_policy_v3.py build/refusal-validation3
          cat build/refusal-validation3/analysis.json

      - name: Diagnose refusal-policy domain shift without retuning
        run: |
          python3 research/probes/diagnose_refusal_policy_shift.py build/refusal-repair/cases.csv build/refusal-validation/cases.csv build/refusal-validation2/cases.csv build/policy-shift
          cat build/policy-shift/shift_diagnostic.json

      - name: Test GAUGE deformable adapter contract
        run: python3 research/adapters/test_gauge_adapter.py

      - name: Build and run prescribed-boundary regression
        run: |
          cmake --build build --target vulkax_prescribed_mpm_tests --parallel 2
          ctest --test-dir build --output-on-failure -R '^vulkax_prescribed_mpm$'

      - name: Upload raw synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: vulkax-discovery-cheap-probes-${{ github.sha }}
          path: |
            build/research-cheap-probes
            build/solver-counterfactual
            build/solver-design
            build/solver-certificate
            build/refusal-repair
            build/refusal-validation
            build/refusal-validation2
            build/refusal-validation3
            build/policy-shift
          if-no-files-found: error
          retention-days: 30
