name: Vulkax discovery cheap probes

on:
  push:
    branches: ["research/**"]
  workflow_dispatch:

concurrency:
  group: vulkax-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness-and-cheap-science:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVULKAX_BUILD_TESTS=ON

      - name: Build executable WorldIR regression
        run: cmake --build build --target vulkax_reality_loop_tests --parallel 2

      - name: Run executable WorldIR regression
        run: ctest --test-dir build --output-on-failure -R '^vulkax_reality_loop$'

      - name: Compile identifiability regression at frozen research head
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -UNDEBUG \
            -Iinclude tests/identifiability_tests.cpp \
            src/world/world_ir.cpp src/world/reality_loop.cpp src/numerics/dense.cpp \
            -o build/vulkax_identifiability_tests
          build/vulkax_identifiability_tests

      - name: Compile cheap falsification suite
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -UNDEBUG \
            -Iinclude research/probes/cheap_science_probe.cpp \
            src/world/world_ir.cpp src/world/reality_loop.cpp src/numerics/dense.cpp \
            -o build/vulkax_cheap_science_probe

      - name: Run cheap falsification suite
        run: |
          build/vulkax_cheap_science_probe build/research-cheap-probes
          python3 research/probes/validate_cheap_science.py build/research-cheap-probes
          cat build/research-cheap-probes/cheap_probes.csv

      - name: Build solver-integrated counterfactual probe
        run: cmake --build build --target vulkax_solver_counterfactual_probe --parallel 2

      - name: Run solver-integrated counterfactual and numerical-confounding probes
        run: |
          build/vulkax_solver_counterfactual_probe build/solver-counterfactual
          python3 research/probes/validate_solver_counterfactual.py build/solver-counterfactual
          cat build/solver-counterfactual/solver_counterfactual.csv

      - name: Build solver active-design probe
        run: cmake --build build --target vulkax_solver_active_design_probe --parallel 2

      - name: Run solver active-design probe
        run: |
          build/vulkax_solver_active_design_probe build/solver-design
          python3 research/probes/validate_solver_active_design.py build/solver-design
          cat build/solver-design/solver_design.csv

      - name: Build solver certificate dataset
        run: cmake --build build --target vulkax_solver_certificate_probe --parallel 2

      - name: Generate and analyze solver certificate dataset
        run: |
          build/vulkax_solver_certificate_probe build/solver-certificate
          python3 research/probes/analyze_solver_certificate.py build/solver-certificate
          cat build/solver-certificate/feature_summary.csv

      - name: Upload raw synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: vulkax-discovery-cheap-probes-${{ github.sha }}
          path: |
            build/research-cheap-probes
            build/solver-counterfactual
            build/solver-design
            build/solver-certificate
          if-no-files-found: error
          retention-days: 30
