name: Reality Probe fast post-final hardening replay

on:
  push:
    branches:
      - research/iris-freefall-v67-scale-aware
    paths:
      - .github/workflows/reviewer-hardening-fast-replay.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-replay-and-harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv ffmpeg

      - name: Reproduce already-opened locked IRIS final set
        run: |
          set -Eeuo pipefail
          LOCK_SHA=9e56f06145b8a56dd26c1c81e064ed9b185c77d7
          HIST=/tmp/vulkax-iris-lock
          BUILD="$GITHUB_WORKSPACE/build"
          DATA="$BUILD/public-datasets"
          PUBLIC="$BUILD/publication-validation/public-data"
          FINAL="$BUILD/publication-validation/iris-pendulum-final-test"
          VENV="$BUILD/.venv-iris-postfinal-fast"

          git worktree add --detach "$HIST" "$LOCK_SHA"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --quiet --disable-pip-version-check \
            "huggingface_hub>=0.34,<2" \
            "numpy>=1.26,<3" \
            "opencv-python-headless>=4.10,<5"

          "$VENV/bin/python" - <<'PY'
          from huggingface_hub import snapshot_download
          import os
          root=os.path.join(os.environ["GITHUB_WORKSPACE"],"build","public-datasets","iris")
          snapshot_download(
              repo_id="rasulkhanbayov/IRIS",
              repo_type="dataset",
              revision="c253822f55431ca80ef2084de4bc5e79d1a488f1",
              local_dir=root,
              allow_patterns=[
                  "README.md",
                  "parameters.json",
                  "Pendulum/pendulum_90/*.mp4",
              ],
          )
          print("VALID pinned final-media download")
          PY

          cd "$HIST"
          python3 research/analysis/prepare_public_validation_datasets.py \
            --root "$DATA" \
            --out "$PUBLIC"
          python3 research/analysis/adapt_public_validation_inputs.py \
            --repo-root . \
            --data-root "$DATA" \
            --prepared-root "$PUBLIC"

          rm -rf "$FINAL"
          "$VENV/bin/python" - "$PUBLIC/adapted" "$FINAL" <<'PY'
          import json, statistics, sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd()/"research"/"analysis"))
          import run_iris_pendulum_validation as m

          adapted=Path(sys.argv[1])
          out=Path(sys.argv[2])
          manifests=m.load_pendulum_manifests(adapted,"final_test")
          if len(manifests)!=10:
              raise SystemExit(f"expected 10 final manifests, got {len(manifests)}")

          out.mkdir(parents=True,exist_ok=True)
          rows=[]
          reports=[]
          failures=[]
          for package,manifest in manifests:
              try:
                  rr,report=m.analyze_take(
                      package,manifest,out,width=640,max_seconds=14.0
                  )
                  rows.extend(rr)
                  reports.append(report)
                  if not report["quality_ok"]:
                      failures.append({"scene":report["scene"],"reason":"tracking_quality_gate"})
              except Exception as exc:
                  failures.append({
                      "scene":manifest.get("scene",str(package)),
                      "reason":f"{type(exc).__name__}: {exc}",
                  })

          if failures:
              raise SystemExit("post-final reproduction failed takes: "+json.dumps(failures))
          if len(reports)!=10 or sum(bool(x["quality_ok"]) for x in reports)!=10:
              raise SystemExit("post-final reproduction quality mismatch")

          m.write_csv(out/"validation_records.csv",m.RECORD_FIELDS,rows)
          m.write_csv(out/"take_summary.csv",list(reports[0].keys()),reports)

          lengths=[float(x["period_inferred_length_relative_error"]) for x in reports]
          (out/"summary.json").write_text(json.dumps({
              "schema":"vulkax.iris_pendulum_postfinal_reproduction",
              "version":1,
              "split":"final_test",
              "expected_take_count":10,
              "quality_pass_take_count":10,
              "record_count":len(rows),
              "median_period_inferred_length_relative_error":statistics.median(lengths),
              "claim_guard":"Post-final reproduction only; does not replace the historical lock.",
          },indent=2)+"\n")
          print("VALID historical-analyzer final-set reproduction")
          print("RECORDS",len(rows))
          PY

          "$VENV/bin/python" research/analysis/summarize_iris_pendulum_final_test.py \
            --records "$FINAL/validation_records.csv" \
            --take-summary "$FINAL/take_summary.csv" \
            --out "$FINAL/final_summary.json"

      - name: Require exact agreement with committed locked result
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          locked=json.loads(Path("research/results/IRIS_PENDULUM_FINAL_TEST_RESULT_2026-09-23.json").read_text())
          replay=json.loads(Path("build/publication-validation/iris-pendulum-final-test/final_summary.json").read_text())

          assert replay["take_count"] == locked["dataset"]["takes"]
          assert replay["quality_pass_take_count"] == locked["dataset"]["quality_pass_takes"]
          assert replay["confirmatory_record_count"] == locked["evidence"]["confirmatory_records"]
          assert abs(
              replay["median_period_inferred_length_relative_error"]
              - locked["physical_recovery"]["median_period_inferred_length_relative_error"]
          ) < 1e-12

          for key in ("primary","baseline"):
              r=replay[key]; q=locked[key]
              assert r["method"] == q["method"]
              assert r["strict_correct_n"] == q["correct"]
              assert r["n"] == q["total"]
              assert abs(r["strict_accuracy"]-q["strict_accuracy"]) < 1e-12
              assert r["truth"]["support"]["correct_n"] == q["support_correct"]
              assert r["truth"]["support"]["n"] == q["support_total"]
              assert r["truth"]["veto"]["correct_n"] == q["veto_correct"]
              assert r["truth"]["veto"]["n"] == q["veto_total"]
              assert r["truth"]["unresolved"]["correct_n"] == q["unresolved_correct"]
              assert r["truth"]["unresolved"]["n"] == q["unresolved_total"]

          assert replay["paired_primary_only_correct"] == locked["paired"]["primary_only_correct"]
          assert replay["paired_baseline_only_correct"] == locked["paired"]["baseline_only_correct"]
          assert replay["paired_ties"] == locked["paired"]["ties"]

          print("VALID exact post-final reproduction of committed locked result")
          PY

      - name: Run post-final reviewer hardening
        run: |
          bash research/scripts/run_postfinal_reviewer_hardening.sh \
            --build-dir build \
            --profile quick \
            --no-video

      - name: Print hardening summaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths=[
            "build/publication-validation/iris-pendulum-final-test/final_summary.json",
            "build/publication-validation/iris-pendulum-final-test/clustered_statistics/summary.json",
            "build/publication-validation/iris-pendulum-postfinal-baselines/summary.json",
            "build/publication-validation/iris-pendulum-postfinal-proposals/summary.json",
            "build/publication-validation/iris-pendulum-postfinal-truth-uncertainty/summary.json",
            "build/publication-validation/iris-pendulum-postfinal-dependence/summary.json",
            "build/publication-validation/iris-pendulum-postfinal-robustness/summary.json",
            "build/publication-validation/iris-official-reference/manifest.json",
            "build/publication-validation/reviewer-hardening-manifest.json",
          ]
          for p in paths:
              q=Path(p)
              print("\n===== HARDENING_SUMMARY",p,"=====")
              print(q.read_text())
          PY

      - name: Upload exact replay and hardening evidence
        uses: actions/upload-artifact@v4
        with:
          name: reality-probe-fast-postfinal-hardening-${{ github.sha }}
          path: |
            build/publication-validation/iris-pendulum-final-test
            build/publication-validation/iris-pendulum-postfinal-baselines
            build/publication-validation/iris-pendulum-postfinal-proposals
            build/publication-validation/iris-pendulum-postfinal-truth-uncertainty
            build/publication-validation/iris-pendulum-postfinal-dependence
            build/publication-validation/iris-pendulum-postfinal-robustness
            build/publication-validation/iris-official-reference
            build/publication-validation/reviewer-hardening-manifest.json
            build/visualization/reviewer-hardening
          if-no-files-found: error
          retention-days: 30
