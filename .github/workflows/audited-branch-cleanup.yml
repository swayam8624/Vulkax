name: Vulkax audited branch cleanup

on:
  push:
    branches: ["main"]
    paths:
      - "BRANCH_CLEANUP_TRIGGER.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vulkax-audited-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit branch containment
        run: ./research/scripts/audit_branch_cleanup.sh

      - name: Delete only currently safe redundant branches
        run: ./research/scripts/audit_branch_cleanup.sh --delete

      - name: Show remaining remote branches
        run: |
          git fetch origin --prune
          git branch -r
