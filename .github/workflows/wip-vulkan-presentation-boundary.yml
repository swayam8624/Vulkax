name: WIP Vulkan presentation boundary

on:
  push:
    branches:
      - fix/vulkan-presentation-boundary

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/vulkan-presentation-boundary
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libglfw3-dev libglm-dev \
            nlohmann-json3-dev libsqlite3-dev libvulkan-dev mesa-vulkan-drivers \
            libcurl4-openssl-dev glslang-tools pkg-config libopenexr-dev xvfb
      - name: Migrate direct presenter ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tools/vulkax_physics_vulkan_direct.cpp')
          text=path.read_text()
          for include in ['#include "lve_device.hpp"\n','#include "lve_renderer.hpp"\n','#include "lve_window.hpp"\n']:
              text=text.replace(include,'')
          marker='#include "vulkax/relativity/kerr_live_queue.hpp"\n'
          if '#include "vulkax/gpu/vulkan_presentation_context.hpp"' not in text:
              if marker not in text: raise SystemExit('presenter include marker missing')
              text=text.replace(marker,'#include "vulkax/gpu/vulkan_presentation_context.hpp"\n'+marker,1)
          old='''        exportPath_{std::move(exportPath)},
        window_{1280, 720, "Vulkax Physics Studio - Direct Vulkan"},
        device_{window_, benchmarkConfig_},
        renderer_{window_, device_} {'''
          new='''        exportPath_{std::move(exportPath)},
        platform_{1280, 720, "Vulkax Physics Studio - Direct Vulkan", benchmarkConfig_},
        window_{platform_.window()},
        device_{platform_.device()},
        renderer_{platform_.renderer()} {'''
          if old not in text:
              raise SystemExit('presenter constructor ownership marker missing')
          text=text.replace(old,new,1)
          member='''  lve::LveWindow window_;
  lve::LveDevice device_;
  lve::LveRenderer renderer_;
'''
          replacement='''  vulkax::gpu::VulkanPresentationContext platform_;
  // Transitional aliases keep the direct presenter focused on rendering while
  // ownership/lifetime now belong to the Vulkax presentation boundary.
  lve::LveWindow& window_;
  lve::LveDevice& device_;
  lve::LveRenderer& renderer_;
'''
          if member not in text:
              raise SystemExit('presenter member marker missing')
          text=text.replace(member,replacement,1)
          path.write_text(text)

          cmake=Path('cmake/VulkaxApplications.cmake')
          text=cmake.read_text()
          marker='  src/vulkax/sim/mac_live_volume.cpp\n'
          if 'src/vulkax/gpu/vulkan_presentation_context.cpp' not in text:
              if marker not in text: raise SystemExit('direct app source marker missing')
              text=text.replace(marker,marker+'  src/vulkax/gpu/vulkan_presentation_context.cpp\n',1)
          cmake.write_text(text)
          PY
      - name: Configure
        run: >-
          cmake -S . -B build-present -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DVULKAX_BUILD_PHYSICS_STUDIO=OFF
      - name: Build direct Vulkan presenter
        run: cmake --build build-present --target VulkaxPhysicsVulkanDirect
      - name: Resolve Lavapipe
        run: |
          LVP_ICD="$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -type f -name 'lvp_icd*.json' -print -quit 2>/dev/null)"
          test -n "$LVP_ICD"
          echo "VK_DRIVER_FILES=$LVP_ICD" >> "$GITHUB_ENV"
      - name: Run direct presenter smoke
        run: xvfb-run -a build-present/vulkax-physics-vulkan-direct --smoke
      - name: Commit final source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/vulkax_physics_vulkan_direct.cpp cmake/VulkaxApplications.cmake \
            src/vulkax/gpu/vulkan_presentation_context.hpp src/vulkax/gpu/vulkan_presentation_context.cpp
          git diff --cached --check
          git commit -m "Put direct Vulkan presentation behind Vulkax boundary"
          git push origin HEAD:fix/vulkan-presentation-boundary
