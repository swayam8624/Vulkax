name: Vulkax full paper-evidence reproduction

on:
  workflow_dispatch:
  push:
    branches: ["main", "submission/reality-probe-graphics-hardening"]
    paths:
      - "FULL_REPRODUCTION_TRIGGER.txt"

permissions:
  contents: write

concurrency:
  group: vulkax-full-paper-evidence
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential python3

      - name: Full one-command reproduction
        run: bash run_everything.sh --backend none

      - name: Upload complete paper evidence
        uses: actions/upload-artifact@v4
        with:
          name: vulkax-paper-evidence-${{ github.sha }}
          path: build/paper-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Upload generated paper assets
        uses: actions/upload-artifact@v4
        with:
          name: vulkax-paper-assets-${{ github.sha }}
          path: build/paper-figures
          if-no-files-found: error
          retention-days: 30

      - name: Create immutable paper-freeze tag
        if: github.ref == 'refs/heads/main' && hashFiles('PAPER_FREEZE_REQUEST.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          tag="paper-freeze-2026-09-21"
          git config user.name "vulkax-paper-freeze-bot"
          git config user.email "vulkax-paper-freeze-bot@users.noreply.github.com"
          git fetch origin --tags

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Freeze tag already exists; refusing to move it."
            exit 1
          fi

          git tag -a "$tag" "$GITHUB_SHA" \
            -m "Vulkax paper freeze. Exact commit passed the full paper-evidence reproduction workflow on 2026-09-21."
          git push origin "refs/tags/$tag"
          echo "Created immutable paper-freeze tag: $tag -> $GITHUB_SHA"
