name: Vulkax full paper-evidence reproduction

on:
  workflow_dispatch:
  push:
    branches: ["research/integration-20260920"]
    paths:
      - "FULL_REPRODUCTION_TRIGGER.txt"

concurrency:
  group: vulkax-full-paper-evidence
  cancel-in-progress: false

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential python3

      - name: Full one-command reproduction
        run: bash run_everything.sh --backend none

      - name: Upload complete paper evidence
        uses: actions/upload-artifact@v4
        with:
          name: vulkax-paper-evidence-${{ github.sha }}
          path: build/paper-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Upload generated paper assets
        uses: actions/upload-artifact@v4
        with:
          name: vulkax-paper-assets-${{ github.sha }}
          path: build/paper-figures
          if-no-files-found: error
          retention-days: 30
