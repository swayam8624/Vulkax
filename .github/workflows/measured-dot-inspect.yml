name: DOT measured source inspection

on:
  push:
    branches: ["feat/measured-deformable-benchmark"]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned DOT metadata and C02 sequence
        run: |
          mkdir -p build/dot-source
          curl -L --fail --retry 3 \
            'https://dataverse.orc.gmu.edu/api/access/datafile/:persistentId/?persistentId=doi:10.13021/orc2020/XXLVXM/IMQ9BK' \
            -o build/dot-source/A_Read_Me.txt
          curl -L --fail --retry 3 \
            'https://dataverse.orc.gmu.edu/api/access/datafile/:persistentId/?persistentId=doi:10.13021/orc2020/XXLVXM/ZVZHVR' \
            -o build/dot-source/C02.zip
          echo '0f347c3f95ed2def9fd81ba5236955b1  build/dot-source/C02.zip' | md5sum -c -
          unzip -q build/dot-source/C02.zip -d build/dot-source/unpacked
      - name: Probe measured coordinates and surface
        run: |
          echo '===== calib_info.txt ====='
          sed -n '1,40p' build/dot-source/unpacked/C2/cam_info/calib_info.txt
          for f in 000001 000002 000107; do
            echo "===== 3D frame $f ====="
            wc -l build/dot-source/unpacked/C2/coordinates/3d/frame${f}_cam001.txt
            sed -n '1,5p' build/dot-source/unpacked/C2/coordinates/3d/frame${f}_cam001.txt
          done
          echo '===== frame 1 PLY header ====='
          sed -n '1,20p' build/dot-source/unpacked/C2/template/frame000001_cam001.ply
          echo '===== image metadata ====='
          file build/dot-source/unpacked/C2/images/normal_view/frame000001_cam001.jpg
      - name: Compute observable geometry statistics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math
          root=Path('build/dot-source/unpacked/C2')
          def pts(frame):
              out=[]
              path=root/'coordinates/3d'/f'frame{frame:06d}_cam001.txt'
              for line in path.read_text().splitlines():
                  vals=[v.strip() for v in line.split(',')]
                  if len(vals) != 3: raise RuntimeError(f'bad row in {path}: {line!r}')
                  out.append(tuple(map(float, vals)))
              return out
          frames={f:pts(f) for f in range(1,108)}
          assert all(len(v)==225 for v in frames.values())
          p0=frames[1]
          for frame in (1,2,6,11,21,31,41,51,61,81,107):
              p=frames[frame]
              ds=[math.dist(a,b) for a,b in zip(p0,p)]
              print('frame',frame,
                    'rms_from_1',math.sqrt(sum(d*d for d in ds)/len(ds)),
                    'max_from_1',max(ds))
              for axis,name in enumerate('xyz'):
                  v=[q[axis] for q in p]
                  print(' ',name,'min',min(v),'max',max(v),'extent',max(v)-min(v))
          for a,b in ((1,2),(1,11),(11,21),(21,31),(31,41),(41,51)):
              ds=[math.dist(x,y) for x,y in zip(frames[a],frames[b])]
              print('pair',a,b,'rms',math.sqrt(sum(d*d for d in ds)/len(ds)),'max',max(ds))
          # Grid-neighbor lengths are observable and useful for the physical proxy.
          edges=[]
          for r in range(15):
              for c in range(15):
                  i=r*15+c
                  if c+1<15: edges.append(math.dist(p0[i],p0[i+1]))
                  if r+1<15: edges.append(math.dist(p0[i],p0[i+15]))
          edges.sort()
          print('frame1_grid_edge_median',edges[len(edges)//2],
                'min',edges[0],'max',edges[-1])
          PY
