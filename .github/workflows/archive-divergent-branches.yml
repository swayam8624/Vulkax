name: Vulkax archive divergent branches

on:
  push:
    branches: ["main"]
    paths:
      - "ARCHIVE_BRANCHES_TRIGGER.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vulkax-archive-divergent-branches
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive unique branch endpoints as tags and delete working refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune --tags

          canonical="origin/main"
          protected=(
            "main"
            "release/1.0.0"
            "legacy/studio-v1-2026-08-10"
          )

          is_protected() {
            local needle="$1"
            for p in "${protected[@]}"; do
              [[ "$needle" == "$p" ]] && return 0
            done
            return 1
          }

          archived=0
          while IFS= read -r ref; do
            [[ "$ref" == "origin" ]] && continue
            branch="${ref#origin/}"
            [[ "$branch" == "HEAD" ]] && continue
            is_protected "$branch" && continue

            ahead="$(git rev-list --count "$canonical..$ref")"
            if [[ "$ahead" -eq 0 ]]; then
              echo "REDUNDANT $branch (no unique commits) — deleting"
              git push origin --delete "$branch"
              continue
            fi

            tag="archive/2026-09-21/$branch"
            echo "ARCHIVE $branch -> $tag (unique commits: $ahead)"

            if git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "Tag already exists: $tag"
            else
              git tag -a "$tag" "$ref" -m "Archived Vulkax branch $branch on 2026-09-21 before repository cleanup. Unique commits relative to main at archive time: $ahead."
              git push origin "refs/tags/$tag"
            fi

            git push origin --delete "$branch"
            archived=$((archived+1))
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin | sort)

          echo "Archived divergent working branches: $archived"

      - name: Verify final branch topology
        run: |
          git fetch origin --prune --tags
          echo "Remaining branches:"
          git branch -r
          count="$(git for-each-ref --format='%(refname:short)' refs/remotes/origin | grep -v '^origin$' | wc -l | tr -d ' ')"
          echo "Remote branch count: $count"
          test "$count" -eq 3

      - name: Verify archive tags exist
        run: |
          count="$(git tag -l 'archive/2026-09-21/*' | wc -l | tr -d ' ')"
          echo "Archive tag count: $count"
          test "$count" -ge 28
