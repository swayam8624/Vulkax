name: IRIS V6.7 Piecewise Matrix

on:
  push:
    branches:
      - research/iris-freefall-v67-scale-aware
    paths:
      - .github/workflows/iris-v67-piecewise-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  piecewise:
    strategy:
      fail-fast: false
      matrix:
        take: ["06","07","08","09","10"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --quiet             "numpy>=1.26,<3"             "opencv-python-headless>=4.10,<5"             "huggingface_hub>=0.34,<2"
      - name: Fetch spent validation
        run: |
          python research/scripts/fetch_iris_freefall_rescue_v6.py             --data-root build/public-datasets             --config research/validation/iris_freefall_rescue_v6.json             --phase validation
      - name: Piecewise model
        env:
          TAKE: ${{ matrix.take }}
        run: |
          python research/scripts/diagnose_iris_freefall_v67_piecewise.py             --data-root build/public-datasets             --split validation             --take "$TAKE"             --width 640
