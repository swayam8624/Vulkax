name: Publish README visual assets

on:
  push:
    branches: [main]
    paths:
      - "visualization/explainer/**"
      - "visualization/data/**"
      - "visualization/probes/**"
      - "research/results/VULKAX_FINAL_RESULTS_2026-09-21.json"
      - ".github/workflows/publish-readme-visuals.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-visual-publisher
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build frozen replay and README stills
        env:
          FILM_PY: python3
        run: bash visualization/explainer/render_explainer.sh stills

      - name: Package tracked README assets
        run: |
          cp docs/readme_assets/reality_probe_explainer.mp4 /tmp/reality_probe_explainer.mp4
          rm -rf docs/readme_assets
          mkdir -p docs/readme_assets
          cp /tmp/reality_probe_explainer.mp4 docs/readme_assets/
          cp build/reality-probe-explainer/storyboard.png docs/readme_assets/
          cp build/reality-probe-explainer/figures/*.png docs/readme_assets/
          cp build/reality-probe-explainer/figures/*.svg docs/readme_assets/

      - name: Build full-length animated README explainer
        run: |
          ffmpeg -hide_banner -loglevel warning -y \
            -i docs/readme_assets/reality_probe_explainer.mp4 \
            -vf "fps=8,scale=720:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=4" \
            docs/readme_assets/reality_probe_explainer_full.gif
          ffmpeg -hide_banner -loglevel warning -y \
            -i docs/readme_assets/reality_probe_explainer.mp4 \
            -vf "fps=10,scale=960:-1:flags=lanczos" \
            -t 8 \
            docs/readme_assets/reality_probe_explainer_preview.gif

      - name: Validate README asset package
        run: |
          test -s docs/readme_assets/reality_probe_explainer.mp4
          test -s docs/readme_assets/reality_probe_explainer_full.gif
          test -s docs/readme_assets/reality_probe_explainer_preview.gif
          test -s docs/readme_assets/storyboard.png
          duration="$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 docs/readme_assets/reality_probe_explainer_full.gif)"
          python3 - <<'PY'
from pathlib import Path
import subprocess
duration=float(subprocess.check_output([
    'ffprobe','-v','error','-show_entries','format=duration',
    '-of','default=nk=1:nw=1','docs/readme_assets/reality_probe_explainer_full.gif'
], text=True).strip())
if duration < 115:
    raise SystemExit(f'full README GIF too short: {duration:.3f}s')
print(f'full README GIF duration: {duration:.3f}s')
PY
          for n in 01_question 02_deceptive_repair 03_deception_map 04_same_probe 05_response_overlay 06_fingerprint 07_residual_field 08_dcs_intuition 09_standardization 10_signal_gain 11_information_limit 12_conclusion; do
            test -s "docs/readme_assets/${n}.png"
            test -s "docs/readme_assets/${n}.svg"
          done

      - name: Commit generated README assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/readme_assets
          if git diff --cached --quiet; then
            echo "README visual assets already current"
            exit 0
          fi
          git commit -m "docs: publish regenerated Reality Probe README visuals"
          git pull --rebase origin main
          git push origin HEAD:main
