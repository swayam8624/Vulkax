name: Phase 10 Studio scene UI wiring

on:
  push:
    branches:
      - agent/phase10-studio-scene-ui

permissions:
  contents: write

jobs:
  wire-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase10-studio-scene-ui
      - name: Wire scene model, camera and workspace
        run: |
          python3 scripts/phase10_wire_studio.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/VulkaxPhysicsStudioMac/Sources/VulkaxPhysicsStudioMac/main.swift')
          text = path.read_text()
          text = text.replace(
              'tan(radians(clamp(u.cameraUpFov.w, 10.0, 120.0)) * 0.5)',
              'tan(clamp(u.cameraUpFov.w, 10.0, 120.0) * (M_PI_F / 180.0) * 0.5)')
          path.write_text(text)
          PY
      - name: Build native Studio
        working-directory: apps/VulkaxPhysicsStudioMac
        run: swift build -c release
      - name: Verify scalar and volume GPU paths
        working-directory: apps/VulkaxPhysicsStudioMac
        run: |
          .build/release/VulkaxPhysicsStudioMac --native-gpu-smoke
          .build/release/VulkaxPhysicsStudioMac --native-volume-gpu-smoke
      - name: Commit validated Studio wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git diff --cached --check
          git commit -m "Build scene-first Studio UI and camera workflow"
          git push origin HEAD:agent/phase10-studio-scene-ui
