name: Phase 9 medium inference wiring

on:
  push:
    branches:
      - agent/phase9-medium-scene-semantics

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase9-medium-scene-semantics
      - name: Wire medium inference into build and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('CMakeLists.txt')
          text = root.read_text()
          marker = '  src/vulkax/physics/physics_ir.cpp\n'
          addition = marker + '  src/vulkax/physics/medium_inference.cpp\n'
          if 'src/vulkax/physics/medium_inference.cpp' not in text:
              if marker not in text:
                  raise SystemExit('physics IR source marker missing')
              text = text.replace(marker, addition, 1)
          root.write_text(text)

          tests = Path('cmake/VulkaxTests.cmake')
          text = tests.read_text()
          anchor = '  add_test(NAME physics_ir COMMAND PhysicsIrTests)\n'
          block = anchor + '''\n  add_executable(\n    MediumInferenceTests\n    tests/medium_inference_tests.cpp\n  )\n  target_compile_features(MediumInferenceTests PRIVATE cxx_std_20)\n  target_link_libraries(MediumInferenceTests PRIVATE vulkax_physics_ir)\n  add_test(NAME medium_inference COMMAND MediumInferenceTests)\n'''
          if 'MediumInferenceTests' not in text:
              if anchor not in text:
                  raise SystemExit('physics IR test marker missing')
              text = text.replace(anchor, block, 1)
          tests.write_text(text)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt cmake/VulkaxTests.cmake
          git diff --cached --check
          git commit -m "Wire simulation medium inference tests"
          git push origin HEAD:agent/phase9-medium-scene-semantics
