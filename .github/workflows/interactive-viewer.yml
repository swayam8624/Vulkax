name: Interactive viewer

on:
  pull_request:
    paths:
      - 'scripts/build_interactive_viewer.py'
      - 'scripts/build_interactive_viewer_app.py'
      - 'scripts/viewer_importers.js'
      - 'scripts/viewer_importers_test.js'
      - 'docs/INTERACTIVE_VIEWER_MVP.md'
      - '.github/workflows/interactive-viewer.yml'
  workflow_dispatch:

jobs:
  viewer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python self-tests
        run: |
          python3 scripts/build_interactive_viewer.py --self-test
          python3 scripts/build_interactive_viewer_app.py --self-test

      - name: Importer regression tests
        run: node scripts/viewer_importers_test.js

      - name: Generate persistent hardened viewer fixture
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          import build_interactive_viewer_app as app

          root = Path('/tmp/vulkax-viewer-fixture')
          (root / 'appearance').mkdir(parents=True, exist_ok=True)
          (root / 'influence').mkdir(parents=True, exist_ok=True)
          ply = '''ply
          format ascii 1.0
          element vertex 4
          property float x
          property float y
          property float z
          property float f_dc_0
          property float f_dc_1
          property float f_dc_2
          property float opacity
          property float scale_0
          property float scale_1
          property float scale_2
          end_header
          -1 -1 0 0 0 0 4 -3 -3 -3
          1 -1 0 0 0 0 4 -3 -3 -3
          1 1 0 0 0 0 4 -3 -3 -3
          -1 1 0 0 0 0 4 -3 -3 -3
          '''
          ply = '\n'.join(line.strip() for line in ply.splitlines()) + '\n'
          (root / 'appearance' / 'before.ply').write_text(ply)
          (root / 'appearance' / 'rewritten.ply').write_text(ply)
          particles = root / 'particles.csv'
          particles.write_text('particle_id,rest_x,rest_y,rest_z,mass,rest_volume\n' + '\n'.join(
              f'{1 + x + 2*y + 4*z},{x},{y},{z},1,1'
              for z in range(2) for y in range(2) for x in range(2)
          ) + '\n')
          (root / 'influence' / 'selected_rewrite_region.csv').write_text('region_id,particle_id\nr,1\n')
          app.build(root, particles, root / 'viewer.html')
          print(root / 'viewer.html')
          PY

      - name: Validate generated HTML contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('/tmp/vulkax-viewer-fixture/viewer.html').read_text()
          required = [
              'Vulkax Interactive Viewer',
              'data-mode="hybrid"',
              'data-mode="gaussian"',
              'data-mode="surface"',
              'data-mode="particles"',
              'canvas id="gl"',
              'WebGL2',
              'Capture PNG',
              "cam.splat*.62:cam.splat*.72",
              "const beforeBtn=document.getElementById('beforeBtn')",
              "VulkaxImport.parseAsset",
              "f.arrayBuffer()",
              "importDrop.addEventListener('drop'",
              "VULKAX_IMPORT_POINT_BUDGET=250000",
          ]
          for token in required:
              assert token in html, token
          assert '__SCENE_JSON__' not in html
          assert 'new DataTransfer()' not in html
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert len(scripts) == 1
          Path('/tmp/vulkax-viewer-fixture/viewer.js').write_text(scripts[0])
          print('interactive_viewer_html_contract: passed')
          PY

      - name: Validate generated JavaScript syntax
        run: node --check /tmp/vulkax-viewer-fixture/viewer.js
