name: Phase 0 Metal readback fix

on:
  push:
    branches:
      - agent/phase0-correctness-ci

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase0-correctness-ci
      - name: Patch smoke-only obstacle readback storage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/VulkaxPhysicsStudioMac/Sources/VulkaxPhysicsStudioMac/main.swift")
          text = path.read_text()
          old = '''        descriptor.usage = [.shaderRead, .shaderWrite]\n        descriptor.storageMode = .private\n        guard let obstacles = device.makeTexture(descriptor: descriptor),\n              let pressure = device.makeTexture(descriptor: descriptor) else { return false }\n'''
          new = '''        descriptor.usage = [.shaderRead, .shaderWrite]\n        // This deterministic smoke test validates the voxelized texture on the\n        // CPU after GPU completion. Keep only that readback texture shared; the\n        // interactive solver continues to allocate private GPU-resident fields.\n        descriptor.storageMode = .shared\n        guard let obstacles = device.makeTexture(descriptor: descriptor) else { return false }\n        descriptor.storageMode = .private\n        guard let pressure = device.makeTexture(descriptor: descriptor) else { return false }\n'''
          if old not in text:
              raise SystemExit("expected imported-mesh texture allocation block not found")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/phase0-metal-readback-fix.yml").unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Metal imported-mesh smoke readback"
          git push origin HEAD:agent/phase0-correctness-ci
