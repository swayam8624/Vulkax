name: Build manuscript artifacts

on:
  push:
    branches: [main]
    paths:
      - 'paper/main.tex'
      - 'paper/references.bib'
      - 'paper/build_word.py'
      - 'paper/main_humanized.tex'
      - 'paper/build_word_humanized.py'
      - '.github/workflows/manuscript-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install manuscript toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk pandoc python3-pip \
            texlive-latex-extra texlive-fonts-extra texlive-science texlive-publishers
          python3 -m pip install --break-system-packages python-docx

      - name: Compile ACM/TOG PDF
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          cp main.pdf Reality_Probe_Manuscript.pdf

      - name: Build editable Word manuscript
        run: python3 paper/build_word.py

      - name: Compile prose-edited ACM/TOG PDF
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error main_humanized.tex
          cp main_humanized.pdf Reality_Probe_Manuscript_Prose_Edited.pdf

      - name: Build prose-edited Word manuscript
        run: |
          python3 paper/build_word_humanized.py
          cp paper/Reality_Probe_Manuscript_Prose_Edited.pdf paper/Reality_Probe_Manuscript_Final.pdf
          cp paper/Reality_Probe_Manuscript_Prose_Edited.docx paper/Reality_Probe_Manuscript_Final.docx

      - name: Record checksums
        run: |
          cd paper
          sha256sum Reality_Probe_Manuscript.pdf Reality_Probe_Manuscript.docx > MANUSCRIPT_SHA256.txt
          sha256sum Reality_Probe_Manuscript_Prose_Edited.pdf Reality_Probe_Manuscript_Prose_Edited.docx > MANUSCRIPT_PROSE_EDITED_SHA256.txt
          sha256sum Reality_Probe_Manuscript_Final.pdf Reality_Probe_Manuscript_Final.docx > FINAL_MANUSCRIPT_SHA256.txt

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/Reality_Probe_Manuscript.pdf paper/Reality_Probe_Manuscript.docx paper/MANUSCRIPT_SHA256.txt \
            paper/Reality_Probe_Manuscript_Prose_Edited.pdf paper/Reality_Probe_Manuscript_Prose_Edited.docx paper/MANUSCRIPT_PROSE_EDITED_SHA256.txt \
            paper/Reality_Probe_Manuscript_Final.pdf paper/Reality_Probe_Manuscript_Final.docx paper/FINAL_MANUSCRIPT_SHA256.txt
          if git diff --cached --quiet; then
            echo "Generated manuscript artifacts are unchanged."
            exit 0
          fi
          git commit -m "paper: compile final PDF and DOCX [skip ci]"
          git push origin HEAD:main
