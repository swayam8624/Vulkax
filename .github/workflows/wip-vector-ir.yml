name: WIP vector-field IR integration

on:
  push:
    branches:
      - fix/vector-field-ir-integration

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/vector-field-ir-integration
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libglfw3-dev libglm-dev \
            nlohmann-json3-dev libsqlite3-dev libvulkan-dev libcurl4-openssl-dev \
            glslang-tools pkg-config libopenexr-dev
      - name: Wire vector IR targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('CMakeLists.txt')
          text=root.read_text()
          marker='  src/vulkax/physics/compute_ir.cpp\n'
          if 'src/vulkax/physics/vector_compute_ir.cpp' not in text:
              if marker not in text: raise SystemExit('physics IR source marker missing')
              text=text.replace(marker,marker+'  src/vulkax/physics/vector_compute_ir.cpp\n',1)
          emit_marker='''add_executable(VulkaxStencilShaderEmit tools/stencil_shader_emit.cpp)
set_target_properties(VulkaxStencilShaderEmit PROPERTIES OUTPUT_NAME vulkax-stencil-shader)
target_compile_features(VulkaxStencilShaderEmit PRIVATE cxx_std_20)
target_link_libraries(VulkaxStencilShaderEmit PRIVATE vulkax_physics_ir)
'''
          emit_block=emit_marker+'''\nadd_executable(VulkaxVectorShaderEmit tools/vector_ir_shader_emit.cpp)
set_target_properties(VulkaxVectorShaderEmit PROPERTIES OUTPUT_NAME vulkax-vector-shader)
target_compile_features(VulkaxVectorShaderEmit PRIVATE cxx_std_20)
target_link_libraries(VulkaxVectorShaderEmit PRIVATE vulkax_physics_ir)
'''
          if 'VulkaxVectorShaderEmit' not in text:
              if emit_marker not in text: raise SystemExit('shader emit marker missing')
              text=text.replace(emit_marker,emit_block,1)
          root.write_text(text)

          tests=Path('cmake/VulkaxTests.cmake')
          text=tests.read_text()
          anchor='  add_test(NAME physics_ir COMMAND PhysicsIrTests)\n'
          block=anchor+'''\n  add_executable(VectorComputeIrTests tests/vector_compute_ir_tests.cpp)
  target_compile_features(VectorComputeIrTests PRIVATE cxx_std_20)
  target_link_libraries(VectorComputeIrTests PRIVATE vulkax_physics_ir)
  add_test(NAME vector_compute_ir COMMAND VectorComputeIrTests)
'''
          if 'VectorComputeIrTests' not in text:
              if anchor not in text: raise SystemExit('physics_ir test marker missing')
              text=text.replace(anchor,block,1)
          tests.write_text(text)
          PY
      - name: Configure and build
        run: >-
          cmake -S . -B build-vector -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DVULKAX_BUILD_PHYSICS_STUDIO=OFF
      - name: Build vector IR surface
        run: cmake --build build-vector --target VectorComputeIrTests VulkaxVectorShaderEmit
      - name: Run vector IR CPU oracle tests
        run: ctest --test-dir build-vector -R '^vector_compute_ir$' --output-on-failure
      - name: Compile generated GLSL
        run: |
          build-vector/vulkax-vector-shader --glsl /tmp/vector.comp --msl /tmp/vector.metal
          glslangValidator -V /tmp/vector.comp -o /tmp/vector.comp.spv
          grep -q 'kernel void vectorField' /tmp/vector.metal
      - name: Commit final integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt cmake/VulkaxTests.cmake src/vulkax/physics/vector_compute_ir.cpp \
            src/vulkax/physics/vector_compute_ir.hpp tests/vector_compute_ir_tests.cpp tools/vector_ir_shader_emit.cpp
          git diff --cached --check
          git commit -m "Add executable vector-field Physics IR"
          git push origin HEAD:fix/vector-field-ir-integration
