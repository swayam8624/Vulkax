name: Reflected Vulkan arena suballocation

on:
  push:
    branches:
      - agent/phase1-resource-arena-allocator

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase1-resource-arena-allocator
      - name: Apply block suballocator and regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/vulkax/physics/vulkan_resource_arena.cpp")
          text = source.read_text()

          text = text.replace(
              '#include <algorithm>\n#include <cstring>\n',
              '#include <algorithm>\n#include <cstring>\n#include <limits>\n',
              1)

          marker = '''uint32_t VulkanResourceArena::findMemoryType(\n    uint32_t typeMask, VkMemoryPropertyFlags properties) const {\n  VkPhysicalDeviceMemoryProperties memoryProperties{};\n  vkGetPhysicalDeviceMemoryProperties(physicalDevice_, &memoryProperties);\n  for (uint32_t index = 0; index < memoryProperties.memoryTypeCount; ++index) {\n    if ((typeMask & (1u << index)) != 0 &&\n        (memoryProperties.memoryTypes[index].propertyFlags & properties) == properties) {\n      return index;\n    }\n  }\n  throw std::runtime_error("no Vulkan memory type satisfies reflected resource requirements");\n}\n\n'''
          if marker not in text:
              raise SystemExit("findMemoryType block not found")
          allocator = marker + '''VulkanResourceArena::Suballocation VulkanResourceArena::allocateMemory(\n    const VkMemoryRequirements& requirements,\n    VkMemoryPropertyFlags properties,\n    bool imageMemory) {\n  constexpr VkDeviceSize defaultBlockBytes = 16ull * 1024ull * 1024ull;\n  const uint32_t memoryTypeIndex = findMemoryType(requirements.memoryTypeBits, properties);\n  const auto alignUp = [](VkDeviceSize value, VkDeviceSize alignment) {\n    if (alignment <= 1) return value;\n    const VkDeviceSize remainder = value % alignment;\n    if (remainder == 0) return value;\n    if (value > std::numeric_limits<VkDeviceSize>::max() - (alignment - remainder)) {\n      throw std::overflow_error("reflected Vulkan arena allocation alignment overflow");\n    }\n    return value + alignment - remainder;\n  };\n\n  for (MemoryBlock& block : memoryBlocks_) {\n    if (block.memoryTypeIndex != memoryTypeIndex || block.imageMemory != imageMemory) continue;\n    const VkDeviceSize offset = alignUp(block.used, requirements.alignment);\n    if (offset <= block.size && requirements.size <= block.size - offset) {\n      block.used = offset + requirements.size;\n      ++memoryStats_.suballocationCount;\n      memoryStats_.resourceBytes += requirements.size;\n      return {block.memory, offset};\n    }\n  }\n\n  const VkDeviceSize minimumSize = alignUp(requirements.size, requirements.alignment);\n  const VkDeviceSize blockSize = std::max(defaultBlockBytes, minimumSize);\n  VkMemoryAllocateInfo allocation{VK_STRUCTURE_TYPE_MEMORY_ALLOCATE_INFO};\n  allocation.allocationSize = blockSize;\n  allocation.memoryTypeIndex = memoryTypeIndex;\n  VkDeviceMemory memory = VK_NULL_HANDLE;\n  require(vkAllocateMemory(device_, &allocation, allocator_, &memory),\n          "allocate reflected Vulkan arena memory block");\n  memoryBlocks_.push_back({memory, blockSize, requirements.size, memoryTypeIndex, imageMemory});\n  ++memoryStats_.blockCount;\n  ++memoryStats_.suballocationCount;\n  memoryStats_.reservedBytes += blockSize;\n  memoryStats_.resourceBytes += requirements.size;\n  return {memory, 0};\n}\n\n'''
          text = text.replace(marker, allocator, 1)

          old_buffer = '''        const VkMemoryAllocateInfo allocation{\n            VK_STRUCTURE_TYPE_MEMORY_ALLOCATE_INFO,\n            nullptr,\n            requirements.size,\n            findMemoryType(requirements.memoryTypeBits, resource.memoryProperties)};\n        require(vkAllocateMemory(device_, &allocation, allocator_, &resourceSlot.memory),\n                "allocate reflected Vulkan buffer memory");\n        require(vkBindBufferMemory(device_, resourceSlot.buffer, resourceSlot.memory, 0),\n                "bind reflected Vulkan buffer memory");\n'''
          new_buffer = '''        const Suballocation allocation =\n            allocateMemory(requirements, resource.memoryProperties, false);\n        resourceSlot.memory = allocation.memory;\n        resourceSlot.memoryOffset = allocation.offset;\n        require(\n            vkBindBufferMemory(\n                device_, resourceSlot.buffer, resourceSlot.memory, resourceSlot.memoryOffset),\n            "bind reflected Vulkan buffer memory");\n'''
          if old_buffer not in text:
              raise SystemExit("buffer allocation block not found")
          text = text.replace(old_buffer, new_buffer, 1)

          old_image = '''        const VkMemoryAllocateInfo allocation{\n            VK_STRUCTURE_TYPE_MEMORY_ALLOCATE_INFO,\n            nullptr,\n            requirements.size,\n            findMemoryType(requirements.memoryTypeBits, VK_MEMORY_PROPERTY_DEVICE_LOCAL_BIT)};\n        require(vkAllocateMemory(device_, &allocation, allocator_, &resourceSlot.memory),\n                "allocate reflected Vulkan image memory");\n        require(vkBindImageMemory(device_, resourceSlot.image, resourceSlot.memory, 0),\n                "bind reflected Vulkan image memory");\n'''
          new_image = '''        const Suballocation allocation =\n            allocateMemory(requirements, VK_MEMORY_PROPERTY_DEVICE_LOCAL_BIT, true);\n        resourceSlot.memory = allocation.memory;\n        resourceSlot.memoryOffset = allocation.offset;\n        require(\n            vkBindImageMemory(\n                device_, resourceSlot.image, resourceSlot.memory, resourceSlot.memoryOffset),\n            "bind reflected Vulkan image memory");\n'''
          if old_image not in text:
              raise SystemExit("image allocation block not found")
          text = text.replace(old_image, new_image, 1)

          text = text.replace(
              'std::memcpy(static_cast<std::byte*>(mapped) + offset, bytes.data(), bytes.size());',
              'std::memcpy(\n      static_cast<std::byte*>(mapped) + target.memoryOffset + offset, bytes.data(), bytes.size());',
              1)
          text = text.replace(
              'std::memcpy(bytes.data(), static_cast<const std::byte*>(mapped) + offset, bytes.size());',
              'std::memcpy(\n      bytes.data(),\n      static_cast<const std::byte*>(mapped) + source.memoryOffset + offset,\n      bytes.size());',
              1)

          old_destroy = '''      if (resourceSlot.buffer != VK_NULL_HANDLE)\n        vkDestroyBuffer(device_, resourceSlot.buffer, allocator_);\n      if (resourceSlot.memory != VK_NULL_HANDLE)\n        vkFreeMemory(device_, resourceSlot.memory, allocator_);\n      resourceSlot = {};\n    }\n  }\n}\n'''
          new_destroy = '''      if (resourceSlot.buffer != VK_NULL_HANDLE)\n        vkDestroyBuffer(device_, resourceSlot.buffer, allocator_);\n      resourceSlot = {};\n    }\n  }\n  for (MemoryBlock& block : memoryBlocks_) {\n    if (block.memory != VK_NULL_HANDLE) vkFreeMemory(device_, block.memory, allocator_);\n    block = {};\n  }\n  memoryBlocks_.clear();\n  memoryStats_ = {};\n}\n'''
          if old_destroy not in text:
              raise SystemExit("destroy allocation block not found")
          text = text.replace(old_destroy, new_destroy, 1)
          source.write_text(text)

          test = Path("tests/vulkan_resource_arena_tests.cpp")
          t = test.read_text()
          anchor = '''    assert(rejectedImportedUpload);\n\n    PhysicsModel model{};\n'''
          regression = '''    assert(rejectedImportedUpload);\n\n    // Multiple compatible reflected buffers should share one Vulkan device-memory\n    // block while retaining independent aligned offsets and CPU mapping behavior.\n    VulkanResourcePlan pooledPlan{};\n    pooledPlan.bindings.resize(3);\n    for (uint32_t index = 0; index < pooledPlan.bindings.size(); ++index) {\n      pooledPlan.bindings[index].binding = index;\n      pooledPlan.bindings[index].descriptorType = VK_DESCRIPTOR_TYPE_STORAGE_BUFFER;\n      pooledPlan.bindings[index].bufferBytes = 64 + index * 64;\n      pooledPlan.bindings[index].memoryProperties = hostVisible;\n    }\n    auto pooledArena =\n        std::make_unique<VulkanResourceArena>(physical, device, std::move(pooledPlan));\n    const VulkanMemoryArenaStats pooledStats = pooledArena->memoryStats();\n    assert(pooledStats.suballocationCount == 3);\n    assert(pooledStats.blockCount == 1);\n    assert(pooledStats.reservedBytes >= pooledStats.resourceBytes);\n    const std::array<std::byte, 8> pooledUpload{\n        std::byte{0x11}, std::byte{0x22}, std::byte{0x33}, std::byte{0x44},\n        std::byte{0x55}, std::byte{0x66}, std::byte{0x77}, std::byte{0x7f}};\n    pooledArena->uploadBuffer(1, pooledUpload);\n    std::array<std::byte, pooledUpload.size()> pooledDownload{};\n    pooledArena->downloadBuffer(1, pooledDownload);\n    assert(pooledDownload == pooledUpload);\n\n    PhysicsModel model{};\n'''
          if anchor not in t:
              raise SystemExit("test insertion point not found")
          t = t.replace(anchor, regression, 1)
          t = t.replace(
              '    sharedView.reset();\n    sharedOwner.reset();\n',
              '    pooledArena.reset();\n    sharedView.reset();\n    sharedOwner.reset();\n',
              1)
          t = t.replace(
              '              << " history=" << stateResource->historyLength\n              << " image_barriers=" << second.imageBarriers << \'\\n\';',
              '              << " history=" << stateResource->historyLength\n              << " image_barriers=" << second.imageBarriers\n              << " memory_blocks=" << arena->memoryStats().blockCount\n              << " suballocations=" << arena->memoryStats().suballocationCount << \'\\n\';',
              1)
          test.write_text(t)

          Path(".github/workflows/arena-suballocation-refactor.yml").unlink()
          PY
      - name: Commit allocator refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Suballocate reflected Vulkan resource memory"
          git push origin HEAD:agent/phase1-resource-arena-allocator
