name: Phase 8 runtime build migration

on:
  push:
    branches:
      - agent/phase8-finish-runtime-build

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase8-finish-runtime-build
      - name: Finish relocatable build and runtime migration
        run: python3 scripts/phase8_migrate.py
      - name: Commit source migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git diff --cached --check
          git commit -m "Finish relocatable runtime and build migration"
          git push origin HEAD:agent/phase8-finish-runtime-build
