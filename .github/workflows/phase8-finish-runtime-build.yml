name: Phase 8 runtime build migration

on:
  push:
    branches:
      - agent/phase8-finish-runtime-build

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase8-finish-runtime-build
      - name: Finish relocatable build and runtime migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('CMakeLists.txt')
          cmake = root.read_text()
          cmake = cmake.replace('cmake_minimum_required(VERSION 3.11.0)', 'cmake_minimum_required(VERSION 3.24)')

          dependency_marker = 'include(cmake/VulkaxDependencies.cmake)\n'
          runtime_block = '''include(cmake/VulkaxDependencies.cmake)\n\nadd_library(vulkax_runtime_paths STATIC src/runtime_paths.cpp)\ntarget_compile_features(vulkax_runtime_paths PUBLIC cxx_std_20)\ntarget_include_directories(vulkax_runtime_paths PUBLIC ${PROJECT_SOURCE_DIR}/src)\n'''
          if 'add_library(vulkax_runtime_paths STATIC src/runtime_paths.cpp)' not in cmake:
              if dependency_marker not in cmake:
                  raise SystemExit('dependency include marker missing')
              cmake = cmake.replace(dependency_marker, runtime_block, 1)

          source_filter = 'list(FILTER SOURCES EXCLUDE REGEX "/src/vulkax/")\n'
          runtime_remove = source_filter + 'list(REMOVE_ITEM SOURCES "${PROJECT_SOURCE_DIR}/src/runtime_paths.cpp")\n'
          if 'list(REMOVE_ITEM SOURCES "${PROJECT_SOURCE_DIR}/src/runtime_paths.cpp")' not in cmake:
              if source_filter not in cmake:
                  raise SystemExit('source filter marker missing')
              cmake = cmake.replace(source_filter, runtime_remove, 1)

          tool_targets = [
              'VulkaxComputeBenchmark',
              'VulkaxActiveRayCompaction',
              'VulkaxSchwarzschildComputeBenchmark',
              'VulkaxSimulationComputeBenchmark',
              'VulkaxReactionComputeBenchmark',
              'VulkaxMacProjectionCompute',
              'VulkaxSparseBrickCompute',
              'VulkaxParticleComputeBenchmark',
          ]
          for target in tool_targets:
              cmake = re.sub(
                  rf'target_compile_definitions\({target} PRIVATE ENGINE_DIR="\$\{{PROJECT_SOURCE_DIR\}}/"\)\n',
                  '', cmake)
              pattern = rf'target_link_libraries\({target} PRIVATE ([^\n]*)\)'
              match = re.search(pattern, cmake)
              if not match:
                  raise SystemExit(f'link line missing for {target}')
              libs = match.group(1)
              if 'vulkax_runtime_paths' not in libs:
                  cmake = re.sub(pattern, f'target_link_libraries({target} PRIVATE {libs} vulkax_runtime_paths)', cmake, count=1)

          cmake = re.sub(
              r'\s*target_compile_definitions\(VulkaxPhysicsStudio PRIVATE ENGINE_DIR="\$\{PROJECT_SOURCE_DIR\}/"\)\n',
              '\n', cmake)
          cmake = re.sub(
              r'\s*target_compile_definitions\(VulkaxPhysicsStudioTestRunner PRIVATE ENGINE_DIR="\$\{PROJECT_SOURCE_DIR\}/"\)\n',
              '\n', cmake)
          editor_libs = 'vulkax_research vulkax_sim vulkax_relativity vulkax_physics_ir Vulkan::Vulkan'
          cmake = cmake.replace(editor_libs, 'vulkax_research vulkax_sim vulkax_relativity vulkax_physics_ir vulkax_runtime_paths Vulkan::Vulkan')

          legacy_block = '''add_executable(${PROJECT_NAME} ${SOURCES})\n\ntarget_compile_features(${PROJECT_NAME} PUBLIC cxx_std_20)\ntarget_compile_definitions(${PROJECT_NAME} PRIVATE ENGINE_DIR="${PROJECT_SOURCE_DIR}/")\ntarget_link_libraries(${PROJECT_NAME} glm::glm VulkaxAtlasCore)\n'''
          legacy_replacement = '''add_executable(${PROJECT_NAME} ${SOURCES})\n\ntarget_compile_features(${PROJECT_NAME} PUBLIC cxx_std_20)\nexecute_process(\n  COMMAND git rev-parse HEAD\n  WORKING_DIRECTORY "${PROJECT_SOURCE_DIR}"\n  OUTPUT_VARIABLE VULKAX_BUILD_GIT_COMMIT\n  OUTPUT_STRIP_TRAILING_WHITESPACE\n  ERROR_QUIET\n)\nif (NOT VULKAX_BUILD_GIT_COMMIT)\n  set(VULKAX_BUILD_GIT_COMMIT "unknown")\nendif()\ntarget_compile_definitions(${PROJECT_NAME} PRIVATE VULKAX_BUILD_GIT_COMMIT="${VULKAX_BUILD_GIT_COMMIT}")\ntarget_link_libraries(${PROJECT_NAME} glm::glm VulkaxAtlasCore vulkax_runtime_paths)\n'''
          if legacy_block in cmake:
              cmake = cmake.replace(legacy_block, legacy_replacement, 1)

          windows_old = '''  target_link_directories(${PROJECT_NAME} PUBLIC\n    Vulkan::Vulkan\n    ${GLFW_LIB}\n  )\n\n  target_link_libraries(${PROJECT_NAME} glfw3 vulkan-1 nlohmann_json::nlohmann_json)\n'''
          windows_new = '''  if (GLFW_LIB AND NOT GLFW_LIB STREQUAL "glfw")\n    target_link_directories(${PROJECT_NAME} PUBLIC ${GLFW_LIB})\n  endif()\n\n  target_link_libraries(${PROJECT_NAME} glfw3 Vulkan::Vulkan nlohmann_json::nlohmann_json)\n'''
          if windows_old in cmake:
              cmake = cmake.replace(windows_old, windows_new, 1)

          include_marker = 'include(cmake/VulkaxShaders.cmake)\n\ninclude(cmake/VulkaxApplications.cmake)\n'
          include_replacement = 'include(cmake/VulkaxShaders.cmake)\ninclude(cmake/VulkaxRuntimeResources.cmake)\n\ninclude(cmake/VulkaxApplications.cmake)\n'
          if 'include(cmake/VulkaxRuntimeResources.cmake)' not in cmake:
              if include_marker not in cmake:
                  raise SystemExit('shader/application include marker missing')
              cmake = cmake.replace(include_marker, include_replacement, 1)
          root.write_text(cmake)

          applications = Path('cmake/VulkaxApplications.cmake')
          app = applications.read_text()
          app = app.replace('  src/runtime_paths.cpp\n', '')
          app = app.replace('target_compile_definitions(VulkaxPhysicsVulkanDirect PRIVATE ENGINE_DIR="${PROJECT_SOURCE_DIR}/")\n', '')
          link_old = '  VulkaxPhysicsVulkanDirect PRIVATE glfw vulkax_relativity vulkax_sim Vulkan::Vulkan)'
          link_new = '  VulkaxPhysicsVulkanDirect PRIVATE glfw vulkax_relativity vulkax_sim vulkax_runtime_paths Vulkan::Vulkan)'
          app = app.replace(link_old, link_new)
          app = app.replace('add_dependencies(VulkaxPhysicsVulkanDirect Shaders)\n',
                            'add_dependencies(VulkaxPhysicsVulkanDirect Shaders VulkaxRuntimeResources)\n')
          applications.write_text(app)

          source_files = [
              'src/vulkax/sim/mac_live_volume.cpp',
              'src/vulkax/relativity/kerr_live_queue.cpp',
              'src/vulkax/editor/vulkan_field_executor.cpp',
              'tools/vulkax_mac_projection_compute.cpp',
              'tools/vulkax_particle_compute.cpp',
              'tools/vulkax_sparse_brick_compute.cpp',
              'tools/vulkax_active_ray_compaction.cpp',
              'tools/vulkax_schwarzschild_compute.cpp',
              'tools/vulkax_sim_compute.cpp',
              'tools/vulkax_physics_vulkan_direct.cpp',
              'tools/vulkax_reaction_compute.cpp',
              'tools/vulkax_compute.cpp',
          ]
          engine_path_patterns = [
              re.compile(r'std::filesystem::path\{ENGINE_DIR\}\s*/\s*"([^"]+)"'),
              re.compile(r'std::filesystem::path\(ENGINE_DIR\)\s*/\s*"([^"]+)"'),
          ]
          for filename in source_files:
              path = Path(filename)
              text = path.read_text()
              original = text
              for pattern in engine_path_patterns:
                  text = pattern.sub(lambda m: f'lve::resolveRuntimeResource("{m.group(1)}")', text)
              if text != original and '#include "runtime_paths.hpp"' not in text:
                  insertion = text.find('\n') + 1
                  text = text[:insertion] + '#include "runtime_paths.hpp"\n' + text[insertion:]
              path.write_text(text)

          first_app = Path('src/first_app.cpp')
          text = first_app.read_text()
          old_git = '''std::string currentGitCommit() {\n  std::ifstream head{std::filesystem::path{ENGINE_DIR} / ".git/HEAD"};\n  std::string value;\n  std::getline(head, value);\n  constexpr const char* prefix = "ref: ";\n  if (value.rfind(prefix, 0) == 0) {\n    std::ifstream ref{std::filesystem::path{ENGINE_DIR} / ".git" / value.substr(5)};\n    std::getline(ref, value);\n  }\n  return value.empty() ? "unknown" : value;\n}\n'''
          new_git = '''std::string currentGitCommit() {\n#ifdef VULKAX_BUILD_GIT_COMMIT\n  return VULKAX_BUILD_GIT_COMMIT;\n#else\n  return "unknown";\n#endif\n}\n'''
          if old_git in text:
              text = text.replace(old_git, new_git, 1)
          text = text.replace(
              'std::filesystem::directory_iterator(std::filesystem::path{ENGINE_DIR} / "shaders")',
              'std::filesystem::directory_iterator(resolveRuntimeResource("shaders"))')
          text = text.replace(
              '      config.atlasNavigationReplay.is_absolute()\n          ? config.atlasNavigationReplay\n          : std::filesystem::path{ENGINE_DIR} /\n                config.atlasNavigationReplay;',
              '      config.atlasNavigationReplay.is_absolute()\n          ? config.atlasNavigationReplay\n          : resolveRuntimeResource(config.atlasNavigationReplay);')
          if ('resolveRuntimeResource(' in text or 'VULKAX_BUILD_GIT_COMMIT' in text) and '#include "runtime_paths.hpp"' not in text:
              first_include = text.find('\n') + 1
              text = text[:first_include] + '#include "runtime_paths.hpp"\n' + text[first_include:]
          first_app.write_text(text)

          shaders = Path('cmake/VulkaxShaders.cmake')
          shader_text = shaders.read_text()
          shader_text = shader_text.replace(
              '# Static legacy shaders still emit beside their checked source files because\n# older executables resolve them through ENGINE_DIR. New/generated artifacts\n# must live under CMAKE_BINARY_DIR; migrate legacy paths only alongside the\n# runtime-resource contract that consumes them.\n',
              '# All compiled shader artifacts live in the build tree. Runtime binaries consume\n# staged executable-relative resources and never mutate the source checkout.\n')
          old_loop = '''foreach(GLSL ${GLSL_SOURCE_FILES})\n  get_filename_component(FILE_NAME ${GLSL} NAME)\n  set(SPIRV "${PROJECT_SOURCE_DIR}/shaders/${FILE_NAME}.spv")\n  add_custom_command(\n    OUTPUT ${SPIRV}\n    COMMAND ${GLSL_VALIDATOR} -V ${GLSL} -o ${SPIRV}\n    DEPENDS ${GLSL})\n  list(APPEND SPIRV_BINARY_FILES ${SPIRV})\nendforeach(GLSL)\n'''
          new_loop = '''set(VULKAX_STATIC_SHADER_DIR "${CMAKE_BINARY_DIR}/generated/static-shaders")\nforeach(GLSL ${GLSL_SOURCE_FILES})\n  get_filename_component(FILE_NAME ${GLSL} NAME)\n  set(SPIRV "${VULKAX_STATIC_SHADER_DIR}/${FILE_NAME}.spv")\n  add_custom_command(\n    OUTPUT ${SPIRV}\n    COMMAND ${CMAKE_COMMAND} -E make_directory ${VULKAX_STATIC_SHADER_DIR}\n    COMMAND ${GLSL_VALIDATOR} -V ${GLSL} -o ${SPIRV}\n    DEPENDS ${GLSL})\n  list(APPEND SPIRV_BINARY_FILES ${SPIRV})\nendforeach(GLSL)\n'''
          if old_loop not in shader_text:
              raise SystemExit('static shader loop marker missing')
          shader_text = shader_text.replace(old_loop, new_loop, 1)
          shaders.write_text(shader_text)

          resources = Path('cmake/VulkaxRuntimeResources.cmake')
          resource_text = resources.read_text()
          resource_text = resource_text.replace(
              '  DEPENDS Shaders\n',
              '  COMMAND ${CMAKE_COMMAND} -E copy_directory\n          "${VULKAX_STATIC_SHADER_DIR}"\n          "${VULKAX_RUNTIME_RESOURCE_DIR}/shaders"\n  COMMAND ${CMAKE_COMMAND} -E copy_directory\n          "${VULKAX_GENERATED_SHADER_DIR}"\n          "${VULKAX_RUNTIME_RESOURCE_DIR}/shaders"\n  DEPENDS Shaders VulkaxGeneratedEquationShaders VulkaxGeneratedStencilShaders\n',
              1)
          if 'VulkaxPhysicsVulkanDirect' not in resource_text:
              resource_text = resource_text.replace(
                  '    VulkaxPhysicsStudioTestRunner)',
                  '    VulkaxPhysicsStudioTestRunner\n    VulkaxPhysicsVulkanDirect)')
          install_anchor = '''install(\n  DIRECTORY "${PROJECT_SOURCE_DIR}/shaders/"\n  DESTINATION "${CMAKE_INSTALL_DATADIR}/vulkax/shaders"\n)\n'''
          install_extra = install_anchor + '''install(\n  DIRECTORY "${VULKAX_STATIC_SHADER_DIR}/"\n  DESTINATION "${CMAKE_INSTALL_DATADIR}/vulkax/shaders"\n)\ninstall(\n  DIRECTORY "${VULKAX_GENERATED_SHADER_DIR}/"\n  DESTINATION "${CMAKE_INSTALL_DATADIR}/vulkax/shaders"\n)\n'''
          if install_extra not in resource_text:
              resource_text = resource_text.replace(install_anchor, install_extra, 1)
          resources.write_text(resource_text)

          ci = Path('.github/workflows/ci.yml')
          workflow = ci.read_text()
          anchor = '      - name: Verify Vulkan software device\n        run: vulkaninfo --summary\n'
          relocated = anchor + '''      - name: Relocated runtime resource smoke\n        run: |\n          test -f build/resources/shaders/vulkax_wave_field.comp.spv\n          rm -rf /tmp/vulkax-relocated\n          mkdir -p /tmp/vulkax-relocated\n          cp build/vulkax-compute /tmp/vulkax-relocated/\n          cp -R build/resources /tmp/vulkax-relocated/resources\n          (cd /tmp && /tmp/vulkax-relocated/vulkax-compute \\\n            --width 16 --height 9 --output /tmp/vulkax-relocated-wave)\n'''
          if 'Relocated runtime resource smoke' not in workflow:
              if anchor not in workflow:
                  raise SystemExit('CI Vulkan device anchor missing')
              workflow = workflow.replace(anchor, relocated, 1)
          ci.write_text(workflow)

          for obsolete in [
              Path('.github/workflows/phase2-windows-link-fix.yml'),
              Path('.github/workflows/runtime-resource-refactor.yml'),
              Path('.github/workflows/phase8-finish-runtime-build.yml'),
          ]:
              if obsolete.exists():
                  obsolete.unlink()
          PY
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish relocatable runtime and build migration"
          git push origin HEAD:agent/phase8-finish-runtime-build
