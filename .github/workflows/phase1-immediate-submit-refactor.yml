name: Phase 1 immediate submit refactor

on:
  push:
    branches:
      - agent/phase1-gpu-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase1-gpu-runtime
      - name: Refactor internal upload submissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path("src/lve_device.hpp")
          h = header.read_text()
          h = h.replace(
              '#include <string>\n#include <vector>\n',
              '#include <functional>\n#include <mutex>\n#include <string>\n#include <vector>\n',
              1)
          h = h.replace(
              '  void createCommandPool();\n\n  // helper functions\n',
              '  void createCommandPool();\n  void submitImmediate(const std::function<void(VkCommandBuffer)>& record);\n\n  // helper functions\n',
              1)
          h = h.replace(
              '  VkCommandPool commandPool;\n\n  VkDevice device_;\n',
              '  VkCommandPool commandPool = VK_NULL_HANDLE;\n  VkCommandBuffer immediateCommandBuffer = VK_NULL_HANDLE;\n  VkFence immediateFence = VK_NULL_HANDLE;\n  std::mutex immediateSubmitMutex;\n\n  VkDevice device_;\n',
              1)
          header.write_text(h)

          source = Path("src/lve_device.cpp")
          s = source.read_text()
          s = s.replace(
              '  vkDestroyCommandPool(device_, commandPool, nullptr);\n  vkDestroyDevice(device_, nullptr);\n',
              '  vkDestroyFence(device_, immediateFence, nullptr);\n  vkDestroyCommandPool(device_, commandPool, nullptr);\n  vkDestroyDevice(device_, nullptr);\n',
              1)
          old_pool = '''  checkVk(vkCreateCommandPool(device_, &poolInfo, nullptr, &commandPool), "vkCreateCommandPool");\n}\n'''
          new_pool = '''  checkVk(vkCreateCommandPool(device_, &poolInfo, nullptr, &commandPool), "vkCreateCommandPool");\n\n  VkCommandBufferAllocateInfo commandInfo{};\n  commandInfo.sType = VK_STRUCTURE_TYPE_COMMAND_BUFFER_ALLOCATE_INFO;\n  commandInfo.commandPool = commandPool;\n  commandInfo.level = VK_COMMAND_BUFFER_LEVEL_PRIMARY;\n  commandInfo.commandBufferCount = 1;\n  checkVk(\n      vkAllocateCommandBuffers(device_, &commandInfo, &immediateCommandBuffer),\n      "vkAllocateCommandBuffers(immediate)");\n\n  VkFenceCreateInfo fenceInfo{};\n  fenceInfo.sType = VK_STRUCTURE_TYPE_FENCE_CREATE_INFO;\n  checkVk(vkCreateFence(device_, &fenceInfo, nullptr, &immediateFence), "vkCreateFence(immediate)");\n}\n'''
          if old_pool not in s:
              raise SystemExit("createCommandPool block not found")
          s = s.replace(old_pool, new_pool, 1)

          old_buffer_start = '''void LveDevice::createBuffer(\n    VkDeviceSize size,\n    VkBufferUsageFlags usage,\n    VkMemoryPropertyFlags properties,\n    VkBuffer &buffer,\n    VkDeviceMemory &bufferMemory) {\n  VkBufferCreateInfo bufferInfo{};\n'''
          new_buffer_start = '''void LveDevice::createBuffer(\n    VkDeviceSize size,\n    VkBufferUsageFlags usage,\n    VkMemoryPropertyFlags properties,\n    VkBuffer &buffer,\n    VkDeviceMemory &bufferMemory) {\n  buffer = VK_NULL_HANDLE;\n  bufferMemory = VK_NULL_HANDLE;\n  VkBufferCreateInfo bufferInfo{};\n'''
          if old_buffer_start not in s:
              raise SystemExit("createBuffer start not found")
          s = s.replace(old_buffer_start, new_buffer_start, 1)

          old_copy = '''void LveDevice::copyBuffer(VkBuffer srcBuffer, VkBuffer dstBuffer, VkDeviceSize size) {\n  VkCommandBuffer commandBuffer = beginSingleTimeCommands();\n\n  VkBufferCopy copyRegion{};\n  copyRegion.srcOffset = 0;  // Optional\n  copyRegion.dstOffset = 0;  // Optional\n  copyRegion.size = size;\n  vkCmdCopyBuffer(commandBuffer, srcBuffer, dstBuffer, 1, &copyRegion);\n\n  endSingleTimeCommands(commandBuffer);\n}\n\nvoid LveDevice::copyBufferToImage(\n    VkBuffer buffer, VkImage image, uint32_t width, uint32_t height, uint32_t layerCount) {\n  VkCommandBuffer commandBuffer = beginSingleTimeCommands();\n\n  VkBufferImageCopy region{};\n  region.bufferOffset = 0;\n  region.bufferRowLength = 0;\n  region.bufferImageHeight = 0;\n\n  region.imageSubresource.aspectMask = VK_IMAGE_ASPECT_COLOR_BIT;\n  region.imageSubresource.mipLevel = 0;\n  region.imageSubresource.baseArrayLayer = 0;\n  region.imageSubresource.layerCount = layerCount;\n\n  region.imageOffset = {0, 0, 0};\n  region.imageExtent = {width, height, 1};\n\n  vkCmdCopyBufferToImage(\n      commandBuffer,\n      buffer,\n      image,\n      VK_IMAGE_LAYOUT_TRANSFER_DST_OPTIMAL,\n      1,\n      &region);\n  endSingleTimeCommands(commandBuffer);\n}\n'''
          new_copy = '''void LveDevice::submitImmediate(const std::function<void(VkCommandBuffer)>& record) {\n  std::scoped_lock lock{immediateSubmitMutex};\n  checkVk(vkResetFences(device_, 1, &immediateFence), "vkResetFences(immediate)");\n  checkVk(vkResetCommandBuffer(immediateCommandBuffer, 0), "vkResetCommandBuffer(immediate)");\n\n  VkCommandBufferBeginInfo beginInfo{};\n  beginInfo.sType = VK_STRUCTURE_TYPE_COMMAND_BUFFER_BEGIN_INFO;\n  beginInfo.flags = VK_COMMAND_BUFFER_USAGE_ONE_TIME_SUBMIT_BIT;\n  checkVk(vkBeginCommandBuffer(immediateCommandBuffer, &beginInfo), "vkBeginCommandBuffer(immediate)");\n  record(immediateCommandBuffer);\n  checkVk(vkEndCommandBuffer(immediateCommandBuffer), "vkEndCommandBuffer(immediate)");\n\n  VkSubmitInfo submitInfo{};\n  submitInfo.sType = VK_STRUCTURE_TYPE_SUBMIT_INFO;\n  submitInfo.commandBufferCount = 1;\n  submitInfo.pCommandBuffers = &immediateCommandBuffer;\n  checkVk(vkQueueSubmit(graphicsQueue_, 1, &submitInfo, immediateFence), "vkQueueSubmit(immediate)");\n  checkVk(\n      vkWaitForFences(device_, 1, &immediateFence, VK_TRUE, UINT64_MAX),\n      "vkWaitForFences(immediate)");\n}\n\nvoid LveDevice::copyBuffer(VkBuffer srcBuffer, VkBuffer dstBuffer, VkDeviceSize size) {\n  submitImmediate([&](VkCommandBuffer commandBuffer) {\n    VkBufferCopy copyRegion{};\n    copyRegion.size = size;\n    vkCmdCopyBuffer(commandBuffer, srcBuffer, dstBuffer, 1, &copyRegion);\n  });\n}\n\nvoid LveDevice::copyBufferToImage(\n    VkBuffer buffer, VkImage image, uint32_t width, uint32_t height, uint32_t layerCount) {\n  submitImmediate([&](VkCommandBuffer commandBuffer) {\n    VkBufferImageCopy region{};\n    region.imageSubresource.aspectMask = VK_IMAGE_ASPECT_COLOR_BIT;\n    region.imageSubresource.mipLevel = 0;\n    region.imageSubresource.baseArrayLayer = 0;\n    region.imageSubresource.layerCount = layerCount;\n    region.imageExtent = {width, height, 1};\n\n    vkCmdCopyBufferToImage(\n        commandBuffer,\n        buffer,\n        image,\n        VK_IMAGE_LAYOUT_TRANSFER_DST_OPTIMAL,\n        1,\n        &region);\n  });\n}\n'''
          if old_copy not in s:
              raise SystemExit("copy helper block not found")
          s = s.replace(old_copy, new_copy, 1)

          old_image_start = '''void LveDevice::createImageWithInfo(\n    const VkImageCreateInfo &imageInfo,\n    VkMemoryPropertyFlags properties,\n    VkImage &image,\n    VkDeviceMemory &imageMemory) {\n  checkVk(vkCreateImage(device_, &imageInfo, nullptr, &image), "vkCreateImage");\n'''
          new_image_start = '''void LveDevice::createImageWithInfo(\n    const VkImageCreateInfo &imageInfo,\n    VkMemoryPropertyFlags properties,\n    VkImage &image,\n    VkDeviceMemory &imageMemory) {\n  image = VK_NULL_HANDLE;\n  imageMemory = VK_NULL_HANDLE;\n  checkVk(vkCreateImage(device_, &imageInfo, nullptr, &image), "vkCreateImage");\n'''
          if old_image_start not in s:
              raise SystemExit("createImage start not found")
          s = s.replace(old_image_start, new_image_start, 1)
          source.write_text(s)
          Path(".github/workflows/phase1-immediate-submit-refactor.yml").unlink()
          PY
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reuse Vulkan immediate-submit resources"
          git push origin HEAD:agent/phase1-gpu-runtime
